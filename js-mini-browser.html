<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- JS mini.Browser logo -->
    <link rel="icon" type="image/jpeg" href="yt.jpeg">
    <link rel="apple-touch-icon" href="yt.jpeg">

    <title>JS mini.Browser</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        marvelRed: '#E23636',
                        marvelDark: '#151515',
                        marvelBlue: '#202A44',
                        marvelGold: '#F78F3F'
                    }
                }
            }
        }
    </script>

    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #151515; }
        ::-webkit-scrollbar-thumb { background: #202A44; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #E23636; }

        .marvel-bg {
            background: radial-gradient(circle at center, #202A44 0%, #151515 100%);
        }

        .fade-in { animation: fadeIn 0.3s ease-in-out; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            html, body {
                width: 100%;
                height: 100%;
                min-width: 0;
                overflow: hidden;
            }

            body { font-size: 14px; }

            header {
                min-height: 55px;
                height: auto;
                padding: 7px 6px !important;
                gap: 5px;
                flex-wrap: nowrap;
            }

            header > div:first-child > div:first-child {
                margin-right: 1px !important;
                padding-left: 2px !important;
                padding-right: 2px !important;
                gap: 3px !important;
            }

            header > div:first-child > div:first-child div {
                width: 7px !important;
                height: 7px !important;
            }

            header > div:first-child {
                gap: 1px !important;
                flex-shrink: 0;
            }

            header > div:first-child button { padding: 6px !important; }

            header > div:first-child button:nth-of-type(2),
            header > div:first-child button:nth-of-type(3) {
                display: none;
            }

            header > div.flex-1 {
                min-width: 0;
                max-width: none !important;
                margin-left: 3px !important;
                margin-right: 3px !important;
            }

            #address-bar {
                width: 100%;
                min-width: 0;
                height: 38px;
                padding-top: 7px !important;
                padding-bottom: 7px !important;
                padding-left: 37px !important;
                padding-right: 9px !important;
                font-size: 12px !important;
                border-radius: 12px !important;
            }

            header > div:last-child {
                gap: 1px !important;
                flex-shrink: 0;
            }

            header > div:last-child .h-6 { display: none; }

            header > div:last-child button:first-of-type { display: none; }

            header > div:last-child button { padding: 6px !important; }

            header > div:last-child img {
                width: 25px !important;
                height: 25px !important;
            }

            #viewport {
                width: 100%;
                max-width: 100vw;
                overflow-x: hidden;
            }

            #view-home {
                width: 100%;
                min-width: 0;
                padding: 25px 13px 30px !important;
                justify-content: flex-start !important;
                overflow-y: auto;
                overflow-x: hidden;
                -webkit-overflow-scrolling: touch;
            }

            #view-home > div:first-child {
                width: 100%;
                margin-top: 8vh;
                margin-bottom: 25px !important;
            }

            #view-home > div:first-child > div {
                font-size: 34px !important;
                line-height: 1.1;
                padding: 8px 12px !important;
            }

            #view-home > div:first-child > span {
                display: block;
                margin-left: 0 !important;
                margin-top: 8px !important;
                font-size: 23px !important;
            }

            #view-home > div:nth-child(2) {
                width: 100%;
                max-width: 100%;
            }

            #main-search {
                width: 100%;
                height: 53px;
                padding-left: 48px !important;
                padding-right: 14px !important;
                font-size: 14px !important;
                border-radius: 14px !important;
            }

            #view-home > div:nth-child(3) {
                width: 100%;
                margin-top: 22px !important;
                display: flex;
                justify-content: center;
                align-items: center;
                gap: 10px !important;
                flex-wrap: wrap;
            }

            #view-home > div:nth-child(3) > div { min-width: 76px; }

            #view-home > div:nth-child(3) > div > div {
                width: 50px !important;
                height: 50px !important;
            }

            #view-home > div:nth-child(3) > div > span { font-size: 11px; }

            #view-search-results {
                width: 100%;
                max-width: 100vw;
                padding: 17px 12px 28px !important;
                overflow-y: auto;
                overflow-x: hidden;
                -webkit-overflow-scrolling: touch;
            }

            #view-search-results > div:first-child {
                gap: 9px !important;
                margin-bottom: 16px !important;
            }

            #results-container {
                width: 100%;
                display: flex;
                flex-direction: column;
                gap: 11px !important;
            }

            #results-container > div {
                width: 100%;
                padding: 14px !important;
                border-radius: 12px !important;
                overflow-wrap: anywhere;
            }

            #results-container h3 {
                font-size: 16px !important;
                line-height: 1.35;
            }

            #results-container p {
                font-size: 12px !important;
                line-height: 1.55;
            }

            #view-website {
                width: 100%;
                min-width: 0;
                min-height: 100% !important;
                overflow-x: hidden;
                overflow-y: auto;
                -webkit-overflow-scrolling: touch;
            }

            #website-content {
                width: 100%;
                min-height: 100%;
                overflow-x: hidden;
            }

            #settings-sidebar {
                width: 100% !important;
                max-width: 100vw;
                height: min(78vh, 620px) !important;
                top: auto !important;
                bottom: 0 !important;
                right: 0 !important;
                border-left: 0 !important;
                border-top: 1px solid #333 !important;
                border-radius: 17px 17px 0 0;
                transform: translateY(100%);
            }

            #settings-sidebar:not(.translate-x-full) {
                transform: translateY(0);
            }

            #settings-sidebar .p-4 { padding: 14px !important; }
            #settings-sidebar h2 { font-size: 16px; }
            #settings-sidebar .space-y-6 { gap: 15px; }

            button, a, input { -webkit-tap-highlight-color: transparent; }
            button { touch-action: manipulation; }
            input { touch-action: manipulation; }
        }

        @media (max-width: 420px) {
            header {
                min-height: 51px;
                padding: 6px !important;
            }

            header > div:first-child button { padding: 5px !important; }

            #address-bar {
                height: 36px;
                font-size: 11px !important;
                padding-left: 34px !important;
            }

            header > div:last-child button { padding: 5px !important; }

            header > div:last-child img {
                width: 23px !important;
                height: 23px !important;
            }

            #view-home {
                padding-left: 10px !important;
                padding-right: 10px !important;
            }

            #view-home > div:first-child {
                margin-top: 5vh;
                margin-bottom: 22px !important;
            }

            #view-home > div:first-child > div { font-size: 29px !important; }
            #view-home > div:first-child > span { font-size: 20px !important; }

            #main-search {
                height: 49px;
                font-size: 13px !important;
                padding-left: 44px !important;
            }

            #view-home > div:nth-child(3) {
                margin-top: 18px !important;
                gap: 7px !important;
            }

            #view-home > div:nth-child(3) > div { min-width: 70px; }

            #view-home > div:nth-child(3) > div > div {
                width: 46px !important;
                height: 46px !important;
            }
        }

        @media (max-width: 768px) and (orientation: landscape) {
            #view-home { padding-top: 10px !important; }

            #view-home > div:first-child {
                margin-top: 2vh;
                margin-bottom: 13px !important;
            }

            #view-home > div:first-child > div { font-size: 26px !important; }
            #view-home > div:first-child > span { font-size: 18px !important; }
            #main-search { height: 45px; }
        }
    
        /* Public website directory: one website per row, Chrome-like spacing */
        .jsmini-sites-grid{
            display:flex !important;
            flex-direction:column !important;
            align-items:stretch !important;
            gap:14px !important;
        }
        .jsmini-sites-grid .jsmini-site-card{
            width:100% !important;
            box-sizing:border-box !important;
        }

</style>

        .jsmini-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}.jsmini-btn{border:0;border-radius:10px;padding:10px 15px;font-size:12px;font-weight:900;cursor:pointer}.jsmini-btn.cancel{background:#262626;color:#d1d5db}.jsmini-btn.deploy{background:#E23636;color:#fff;box-shadow:0 5px 18px rgba(226,54,54,.25)}.jsmini-btn.deploy:hover{background:#b91c1c}.jsmini-status{margin-top:12px;font-size:12px;min-height:18px}.jsmini-success{color:#86efac}.jsmini-error{color:#fca5a5}.jsmini-loading{color:#F78F3F}

        .jsmini-sites-section{width:min(900px,100%);margin:30px auto 0;padding:0 8px}.jsmini-sites-title{font-size:13px;color:#9ca3af;text-transform:uppercase;letter-spacing:.12em;margin-bottom:12px;font-weight:900}.jsmini-sites-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.jsmini-site-card{background:#151515;border:1px solid #333;border-radius:12px;padding:15px;text-align:left;cursor:pointer;transition:.2s}.jsmini-site-card:hover{border-color:#E23636;transform:translateY(-2px)}.jsmini-site-card h3{font-size:15px;font-weight:900;margin:0 0 5px}.jsmini-site-card p{font-size:11px;color:#9ca3af;line-height:1.5;margin:0 0 9px}.jsmini-site-card .domain{font-size:10px;color:#F78F3F;font-weight:800}
        @media(max-width:600px){.jsmini-modal{padding:17px;border-radius:13px}.jsmini-actions{flex-direction:column-reverse}.jsmini-btn{width:100%}.jsmini-sitebar{padding:8px 10px}.jsmini-open-frame{height:calc(100vh - 96px)}}

        .jsmini-chrome-results{

<body class="h-screen w-full bg-marvelDark text-white overflow-hidden flex flex-col font-sans">

    <header class="bg-[#0a0a0a] border-b-2 border-marvelRed p-2 flex items-center justify-between shadow-md z-20">
        <div class="flex items-center gap-2">
            <div class="flex gap-1.5 mr-4 px-2">
                <div class="w-3 h-3 rounded-full bg-red-500"></div>
                <div class="w-3 h-3 rounded-full bg-yellow-500"></div>
                <div class="w-3 h-3 rounded-full bg-green-500"></div>
            </div>

            <button onclick="goHome()" class="p-1.5 rounded hover:bg-gray-800 text-gray-400 hover:text-white transition" title="Home">
                <i data-lucide="home" class="w-5 h-5"></i>
            </button>

            <button onclick="goJSMiniBack()" class="p-1.5 rounded hover:bg-gray-800 text-gray-400 hover:text-white transition" title="Back">
                <i data-lucide="arrow-left" class="w-5 h-5"></i>
            </button>

            <button onclick="goJSMiniForward()" class="p-1.5 rounded hover:bg-gray-800 text-gray-400 hover:text-white transition" title="Forward">
                <i data-lucide="arrow-right" class="w-5 h-5"></i>
            </button>

            <button onclick="refreshPage()" class="p-1.5 rounded hover:bg-gray-800 text-gray-400 hover:text-white transition" title="Refresh">
                <i data-lucide="rotate-cw" class="w-5 h-5"></i>
            </button>
        </div>

            settingsOpen = !settingsOpen;

            if (event.key === 'Enter') {

                if (query.endsWith('.jsmini') || query.endsWith('.js') || query.endsWith('.JS')) {
                    loadSite(query);
                } else {
                    executeSearch(query);
                }
            }
        }

        function executeSearch(query) {
            if (!query) return;

            document.getElementById('address-bar').value = query;
            document.getElementById('search-query-text').innerText = query;

            const resultsContainer = document.getElementById('results-container');
            resultsContainer.innerHTML = '';

            query = query.toLowerCase();

            const matches = mockDatabase.filter(site =>
                site.title.toLowerCase().includes(query) ||
                site.url.toLowerCase().includes(query) ||
                site.snippet.toLowerCase().includes(query)

                    resultCard.className =

            url = url.toLowerCase();

            if (!url.endsWith('.js')) url += '.js';

        function jsMiniReadHistory(){
            try{
                const raw=JSON.parse(localStorage.getItem(JSMINI_HISTORY_KEY)||'[]');
                return Array.isArray(raw)?raw:[];
            }catch(e){ return []; }
        }

        function jsMiniWriteHistory(items){
            try{
                localStorage.setItem(JSMINI_HISTORY_KEY,JSON.stringify(items.slice(0,500)));
            }catch(e){}
        }

        function jsMiniRecordHistory(title,url,type='page'){
            const cleanUrl=String(url||'').trim();
            if(!cleanUrl)return;

            const items=jsMiniReadHistory();
            const now=new Date().toISOString();
            const filtered=items.filter(x=>String(x.url||'')!==cleanUrl);
            filtered.unshift({
                title:String(title||cleanUrl),
                url:cleanUrl,
                type,
                visitedAt:now
            });
            jsMiniWriteHistory(filtered);
        }

        function jsMiniFormatTime(iso){
            const d=new Date(iso);
            if(Number.isNaN(d.getTime()))return '';
            const diff=Math.max(0,Date.now()-d.getTime());
            const mins=Math.floor(diff/60000);
            if(mins<1)return 'Just now';
            if(mins<60)return `${mins} min ago`;
            const hrs=Math.floor(mins/60);
            if(hrs<24)return `${hrs} hr ago`;
            const days=Math.floor(hrs/24);
            if(days<7)return `${days} day${days===1?'':'s'} ago`;
            return d.toLocaleString();
        }

        async function submitJSMiniDeploy(){
            const state=window.__jsMiniDeployProject;

            if(!state||!jsMiniUser)return;

            const name=document.getElementById('jsminiProjectName').value.trim()||'Untitled Project';
            const description=document.getElementById('jsminiDescription').value.trim();
            const domain=normalizeDomain(document.getElementById('jsminiDomain').value);
            const category=document.getElementById('jsminiCategory').value;
            const visibility=document.getElementById('jsminiVisibility').value;
            const status=document.getElementById('jsminiDeployStatus');
            const btn=document.getElementById('jsminiDeployBtn');

            if(!domainValid(domain)){
                status.className='jsmini-status jsmini-error';
                status.textContent='Use 1–50 lowercase letters, numbers and hyphens.';
                return;
            }

            btn.disabled=true;
            status.className='jsmini-status jsmini-loading';
            status.textContent='Checking virtual domain...';

            try{
                const q=query(
                    collection(jsMiniDb,'public_projects'),
                    where('jsMiniPublished','==',true)
                );

                const taken=await getDocs(q);
                let conflict=false;

                taken.forEach(d=>{
                    const x=d.data();
                    if(
                        x.id!==state.id &&
                        x.jsMiniPublished===true &&
                        normalizeDomain(x.virtualDomain||'')===domain
                    ) conflict=true;
                });

                if(conflict){
                    status.className='jsmini-status jsmini-error';
                    status.textContent='That virtual domain is already taken.';
                    btn.disabled=false;
                    return;
                }

                status.textContent='Preparing your website...';

                const projectFiles=state.data.files||{};
                const htmlBundle=buildJSMiniStandalone(projectFiles);
                const siteIcon=getJSMiniProjectIcon(projectFiles,htmlBundle);

                const site={
                    id:state.id,
                    ownerUid:jsMiniUser.uid,
                    ownerName:jsMiniUser.displayName||'',
                    ownerPhoto:jsMiniUser.photoURL||'',
                    siteIcon,
                    name,
                    description,
                    virtualDomain:domain,
                    category,
                    visibility,
                    status:'published',
                    jsMiniPublished:true,
                    htmlBundle,
                    publishedAt:serverTimestamp(),
                    updatedAt:serverTimestamp()
                };

                await setDoc(
                    doc(jsMiniDb,'public_projects',state.id),
                    site,
                    {merge:true}
                );

                await setDoc(
                    doc(jsMiniDb,'users',jsMiniUser.uid,'projects',state.id),
                    {
                        name,
                        jsMiniDescription:description,
                        jsMiniDomain:domain,
                        jsMiniCategory:category,
                        jsMiniVisibility:visibility,
                        jsMiniDeployed:true
                    },
                    {merge:true}
                );

                status.className='jsmini-status jsmini-success';
                status.textContent='✓ Deployed successfully.';

                setTimeout(()=>{
                    closeJSMiniDeploy();
                    loadJSMiniSite(domain,true);
                },550);

            }catch(e){
                console.error(e);
                status.className='jsmini-status jsmini-error';
                status.textContent='Deployment failed. Please try again.';
                btn.disabled=false;
            }
        }

                '<path d="M2 32h60M32 2c8 8 12 18 12 30S40 54 32 62M32 2C24 10 20 20 20 32s4 22 12 30M7 18h50M7 46h50" fill="none" stroke="#64748b" stroke-width="2"/>' +
                '<path d="M4 32C4 16 16 4 32 4c8 0 15 3 21 9-8-2-16 0-22 5-7 5-10 13-9 21 1 8 6 15 14 20C18 58 4 47 4 32z" fill="#3b82f6" opacity=".9"/>' +
                '<path d="M32 2c-8 8-12 18-12 30s4 22 12 30c8-8 12-18 12-30S40 10 32 2z" fill="none" stroke="#2563eb" stroke-width="1.5"/>' +

            );

        function jsMiniIconValue(value,path){
            const v=String(value||'').trim();
            if(!v)return '';
            if(/^data:image\//i.test(v) || /^(https?:|blob:|\/\/)/i.test(v)) return v;
            const ext=(String(path||'').split('?')[0].split('#')[0].split('.').pop()||'').toLowerCase();
            if(ext==='svg' || /^<svg[\s>]/i.test(v)){
                return 'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(v);
            }
            // Some project asset editors keep binary images as base64 text.
            if(/^(?:[A-Za-z0-9+/]{40,}={0,2})$/.test(v.replace(/\s+/g,''))){
                const mime={png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',gif:'image/gif',webp:'image/webp',ico:'image/x-icon'}[ext];
                if(mime)return 'data:'+mime+';base64,'+v.replace(/\s+/g,'');
            }
            return '';
        }

        function getJSMiniProjectIcon(files,htmlBundle=''){
            const map=files&&typeof files==='object'?files:{};
            const keys=Object.keys(map).filter(k=>!k.endsWith('/'));
            let html='';
            const htmlKey=keys.find(k=>k.toLowerCase()==='index.html')||keys.find(k=>/\.html?$/i.test(k));
            if(htmlKey)html=String(map[htmlKey]||'');
            if(!html && htmlBundle)html=String(htmlBundle);

            const iconRefs=[];
            const patterns=[
                /<link[^>]+rel=["'][^"']*(?:icon|apple-touch-icon)[^"']*["'][^>]+href=["']([^"']+)["']/i,
                /<link[^>]+href=["']([^"']+)["'][^>]+rel=["'][^"']*(?:icon|apple-touch-icon)[^"']*["']/i,
                /<meta[^>]+property=["']og:image["'][^>]+content=["']([^"']+)["']/i,
                /<meta[^>]+content=["']([^"']+)["'][^>]+property=["']og:image["']/i
            ];
            for(const re of patterns){const m=html.match(re);if(m?.[1])iconRefs.push(m[1].trim());}

            // If no explicit icon is declared, accept a conventional project logo/image file.
            for(const k of keys){
                if(/(^|\/)(favicon|logo|icon)\.(svg|png|jpe?g|gif|webp|ico)$/i.test(k)) iconRefs.push(k);
            }
            if(!iconRefs.length){
                const firstImage=keys.find(k=>/\.(svg|png|jpe?g|gif|webp|ico)$/i.test(k));
                if(firstImage)iconRefs.push(firstImage);
            }

            for(const ref of iconRefs){
                if(/^data:image\//i.test(ref)||/^(https?:|blob:|\/\/)/i.test(ref))return ref;
                const clean=jsMiniNormalizeProjectPath(ref.split('?')[0].split('#')[0]);
                const candidates=[clean,clean.replace(/^\.\//,''),keys.find(k=>jsMiniNormalizeProjectPath(k)===clean)];
                for(const k of candidates){
                    if(k && Object.prototype.hasOwnProperty.call(map,k)){
                        const icon=jsMiniIconValue(map[k],k);
                        if(icon)return icon;
                    }
                }
            }
            return jsMiniChromeFallbackIcon();
        }

        function buildJSMiniStandalone(files){
            const keys=Object.keys(files).filter(k=>!k.endsWith('/'));

            const htmlKey=
                keys.find(k=>k.toLowerCase()==='index.html') ||
                keys.find(k=>/\.html?$/i.test(k));

            let html=htmlKey?String(files[htmlKey]||''):'';

            const css=keys
                .filter(k=>/\.css$/i.test(k))
                .map(k=>files[k]||'')
                .join('\n');

            const js=keys
                .filter(k=>/\.(js|mjs)$/i.test(k))
                .map(k=>files[k]||'')
                .join(';\n');

            return `<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>${css}</style></head><body>${html}<script>try{${js}}catch(e){console.error(e)}<\/script></body></html>`;
        }

        async function loadCloudSites(){
            try{
                let snap;

                try{
                    snap=await getDocs(
                        query(
                            collection(jsMiniDb,'public_projects'),
                            where('jsMiniPublished','==',true)
                        )
                    );
                }catch(e){
                    if(!jsMiniUser){
                        try{
                            await signInAnonymously(jsMiniAuth);

                            snap=await getDocs(
                                query(
                                    collection(jsMiniDb,'public_projects'),
                                    where('jsMiniPublished','==',true)
                                )
                            );
                        }catch(e2){
                            throw e2;
                        }
                    }else{
                        throw e;
                    }
                }

                jsMiniCloudSites=[];

                snap.forEach(d=>{
                    jsMiniCloudSites.push({
                        id:d.id,
                        ...d.data()
                    });
                });

                renderCloudSites();

            }catch(e){
                console.error('JS Mini sites load failed:',e);
            }
        }

        function allSites(){
            return jsMiniCloudSites
                .filter(s=>s.visibility!=='unlisted')
                .map(s=>({
                    url:(s.virtualDomain||'')+'.jsmini',
                    title:s.name||'Untitled Website',
                    snippet:s.description||'Published on JS mini.Browser',
                    theme:'dark',
                    cloud:true,
                    site:s
                }));
        }

        function renderCloudSites(){
            const el=document.getElementById('jsmini-cloud-sites');

            if(!el)return;

            const sites=jsMiniCloudSites.filter(s=>s.visibility!=='unlisted');

            if(!sites.length){
                el.innerHTML='<div class="text-xs text-gray-500">No public JS mini websites yet. Be the first to deploy one.</div>';
                return;
            }

            el.innerHTML=sites.slice(0,12).map(s=>`
                <div class="jsmini-site-card" onclick="loadSite('${escapeHTML((s.virtualDomain||'')+'.jsmini')}')">
                    <div class="jsmini-home-site-card">
                        ${s.siteIcon
                            ? `<img class="jsmini-home-site-photo" src="${escapeHTML(s.siteIcon)}" alt="${escapeHTML(s.name||'Website')}" referrerpolicy="no-referrer">`
                            : `<img class="jsmini-home-site-photo" src="${escapeHTML(jsMiniChromeFallbackIcon())}" alt="Website" referrerpolicy="no-referrer">`}
                        <div style="min-width:0">
                            <h3>${escapeHTML(s.name||'Untitled')}</h3>
                            <div class="domain">${escapeHTML((s.virtualDomain||'')+'.jsmini')}</div>
                        </div>
                    </div>
                    <p>${escapeHTML(s.description||'No description')}</p>
                    <div class="domain">${escapeHTML(s.category||'Other')} · Published</div>
                </div>
            `).join('');
        }

        window.executeJSMiniSearch=async function(q){
            const queryText=String(q||'').trim().toLowerCase();

            if(!queryText){
                goHome();
                return;
            }

            await loadCloudSites();

            jsMiniRecordHistory(`Search: ${q}`,String(q),'search');

            const local=mockDatabase.map(x=>({...x,cloud:false}));

            const sites=[
                ...allSites(),
                ...local
            ].filter(s=>
                `${s.title} ${s.snippet} ${s.url}`
                    .toLowerCase()
                    .includes(queryText)
            );

            document.getElementById('search-query-text').textContent=q;

            const c=document.getElementById('results-container');

            if(!sites.length){
                c.innerHTML=`
                    <div class="text-center py-20">
                        <i data-lucide="search-x" class="w-16 h-16 text-gray-600 mx-auto mb-4"></i>
                        <h3 class="text-xl text-gray-300 font-medium">No JS mini websites found</h3>
                        <p class="text-gray-500 mt-2">Only websites deployed inside JS mini.Browser are searchable here.</p>
                    </div>`;
            }else{
                c.className='jsmini-chrome-results';
                c.innerHTML=sites.map(s=>{
                    const projectIcon = s.cloud && s.site && s.site.siteIcon
                        ? escapeHTML(s.site.siteIcon)
                        : escapeHTML(jsMiniChromeFallbackIcon());
                    const avatar = `<img src="${projectIcon}" alt="${escapeHTML(s.title||'Website')}" referrerpolicy="no-referrer">`;
                    return `
                    <div class="jsmini-chrome-result"
                        onclick="loadSite('${escapeHTML(s.url)}')">
                        <div class="jsmini-result-avatar">${avatar}</div>
                        <div class="jsmini-result-body">
                            <div class="jsmini-result-url">
                                js://${escapeHTML(s.url)}
                                <span class="jsmini-result-badge">${s.cloud?'Published':'Demo'}</span>
                            </div>
                            <h3 class="jsmini-result-title">${escapeHTML(s.title)}</h3>
                            <p class="jsmini-result-snippet">${escapeHTML(s.snippet)}</p>
                        </div>
                    </div>`;
                }).join('');
            }

            lucide.createIcons();
            switchView('view-search-results');
        };

        window.loadJSMiniSite=async function(raw,fromHistory=false){
            let domain=normalizeDomain(raw);

            if(!domain)return;

            const full=domain+'.jsmini';

            document.getElementById('address-bar').value=full;

            await loadCloudSites();

            const site=jsMiniCloudSites.find(
                s=>normalizeDomain(s.virtualDomain||'')===domain
            );

            if(site){
                const c=document.getElementById('website-content');

                c.innerHTML=`
                    <div class="jsmini-sitebar">
                        <div>
                            <strong>${escapeHTML(site.name||domain)}</strong>
                            <br>
                            <span>${escapeHTML(full)} · ${escapeHTML(site.description||'')}</span>
                        </div>
                        <span>${escapeHTML(site.category||'Other')}</span>
                    </div>

                    <iframe
                        class="jsmini-open-frame"
                        sandbox="allow-scripts allow-forms allow-modals allow-popups"
                        title="${escapeHTML(site.name||domain)}">
                    </iframe>`;

                const frame=c.querySelector('iframe');

                frame.srcdoc=
                    site.htmlBundle||'<h1>Empty website</h1>';

                switchView('view-website');
                jsMiniRecordHistory(site.name||domain,full,'page');

                if(!fromHistory){
                    jsMiniHistory=
                        jsMiniHistory.slice(0,jsMiniHistoryIndex+1);

                    jsMiniHistory.push(domain);

                    jsMiniHistoryIndex=
                        jsMiniHistory.length-1;
                }

                return;
            }

            const demo=mockDatabase.find(
                x=>normalizeDomain(x.url)===domain
            );

            if(demo){
                window.originalLoadSiteForJSMini
                    ? window.originalLoadSiteForJSMini(raw)
                    : null;
                return;
            }

            loadSite(raw);
        };

        window.loadSite=window.loadJSMiniSite;
        window.executeSearch=window.executeJSMiniSearch;

        window.goJSMiniBack=function(){
            if(jsMiniHistoryIndex>0){
                jsMiniHistoryIndex--;
                loadJSMiniSite(
                    jsMiniHistory[jsMiniHistoryIndex],
                    true
                );
            }else{
                goHome();
            }
        };

        window.goJSMiniForward=function(){
            if(jsMiniHistoryIndex<jsMiniHistory.length-1){
                jsMiniHistoryIndex++;
                loadJSMiniSite(
                    jsMiniHistory[jsMiniHistoryIndex],
                    true
                );
            }
        };

        window.handleJSMiniDeployFromURL=async function(){
            const p=new URLSearchParams(location.search);

            const id=p.get('deploy');
            const site=p.get('site');

            /*
             * Opening js-mini-browser.html normally always shows
             * the JS mini.Browser home page.
             */
            if(id){
                await window.openJSMiniDeploy(id);
                return;
            }

            if(site){
                await loadJSMiniSite(site,true);
                return;
            }

            goHome();
        };

        function addCloudSection(){
            const home=document.getElementById('view-home');

            if(!home||document.getElementById('jsmini-cloud-sites'))return;

            const sec=document.createElement('div');

            sec.className='jsmini-sites-section';

            sec.innerHTML=`
                <div class="jsmini-sites-title">
                    Public JS mini websites
                </div>
                <div id="jsmini-cloud-sites" class="jsmini-sites-grid"></div>
            `;

            home.appendChild(sec);
        }

        window.addEventListener('DOMContentLoaded',()=>{
            ensureJSMiniUI();
            ensureJSMiniFeatureUI();
            addCloudSection();
            loadCloudSites();
            updateJSMiniAccountUI();

            setTimeout(
                ()=>window.handleJSMiniDeployFromURL(),
                100
            );
        });
    </script>

    <script>
        /*
         * Preserve the original demo database while routing real
         * JS mini sites through Firebase.
         */
        window.originalLoadSiteForJSMini = window.loadSite;
    </script>

</body>
</html>
