<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS mini.Browser</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        marvelRed: '#E23636',
                        marvelDark: '#151515',
                        marvelBlue: '#202A44',
                        marvelGold: '#F78F3F'
                    }
                }
            }
        }
    </script>

    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #151515;
        }

        ::-webkit-scrollbar-thumb {
            background: #202A44;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #E23636;
        }

        .marvel-bg {
            background: radial-gradient(
                circle at center,
                #202A44 0%,
                #151515 100%
            );
        }

        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* =========================================================
           MOBILE RESPONSIVE DESIGN
           Desktop design above remains unchanged.
           ========================================================= */

        @media (max-width: 768px) {

            html,
            body {
                width: 100%;
                height: 100%;
                min-width: 0;
                overflow: hidden;
            }

            body {
                font-size: 14px;
            }

            /* ---------- TOP BROWSER BAR ---------- */

            header {
                min-height: 55px;
                height: auto;
                padding: 7px 6px !important;
                gap: 5px;
                flex-wrap: nowrap;
            }

            /* Window dots */
            header > div:first-child > div:first-child {
                margin-right: 1px !important;
                padding-left: 2px !important;
                padding-right: 2px !important;
                gap: 3px !important;
            }

            header > div:first-child > div:first-child div {
                width: 7px !important;
                height: 7px !important;
            }

            /* Navigation */
            header > div:first-child {
                gap: 1px !important;
                flex-shrink: 0;
            }

            header > div:first-child button {
                padding: 6px !important;
            }

            /* Hide back/forward on small screens.
               Home + refresh remain available. */
            header > div:first-child button:nth-of-type(2),
            header > div:first-child button:nth-of-type(3) {
                display: none;
            }

            /* ---------- ADDRESS BAR ---------- */

            header > div.flex-1 {
                min-width: 0;
                max-width: none !important;
                margin-left: 3px !important;
                margin-right: 3px !important;
            }

            #address-bar {
                width: 100%;
                min-width: 0;
                height: 38px;

                padding-top: 7px !important;
                padding-bottom: 7px !important;
                padding-left: 37px !important;
                padding-right: 9px !important;

                font-size: 12px !important;
                border-radius: 12px !important;
            }

            /* ---------- RIGHT SIDE ---------- */

            header > div:last-child {
                gap: 1px !important;
                flex-shrink: 0;
            }

            header > div:last-child .h-6 {
                display: none;
            }

            /* Hide extensions on mobile */
            header > div:last-child button:first-of-type {
                display: none;
            }

            header > div:last-child button {
                padding: 6px !important;
            }

            header > div:last-child img {
                width: 25px !important;
                height: 25px !important;
            }

            /* ---------- MAIN VIEWPORT ---------- */

            #viewport {
                width: 100%;
                max-width: 100vw;
                overflow-x: hidden;
            }

            /* ---------- HOME ---------- */

            #view-home {
                width: 100%;
                min-width: 0;
                padding: 25px 13px 30px !important;
                justify-content: flex-start !important;
                overflow-y: auto;
                overflow-x: hidden;
                -webkit-overflow-scrolling: touch;
            }

            #view-home > div:first-child {
                width: 100%;
                margin-top: 8vh;
                margin-bottom: 25px !important;
            }

            /* JS mini logo */
            #view-home > div:first-child > div {
                font-size: 34px !important;
                line-height: 1.1;
                padding: 8px 12px !important;
            }

            #view-home > div:first-child > span {
                display: block;
                margin-left: 0 !important;
                margin-top: 8px !important;
                font-size: 23px !important;
            }

            /* Main search */
            #view-home > div:nth-child(2) {
                width: 100%;
                max-width: 100%;
            }

            #main-search {
                width: 100%;
                height: 53px;

                padding-left: 48px !important;
                padding-right: 14px !important;

                font-size: 14px !important;
                border-radius: 14px !important;
            }

            /* ---------- QUICK LINKS ---------- */

            #view-home > div:nth-child(3) {
                width: 100%;
                margin-top: 22px !important;

                display: flex;
                justify-content: center;
                align-items: center;

                gap: 10px !important;
                flex-wrap: wrap;
            }

            #view-home > div:nth-child(3) > div {
                min-width: 76px;
            }

            #view-home > div:nth-child(3) > div > div {
                width: 50px !important;
                height: 50px !important;
            }

            #view-home > div:nth-child(3) > div > span {
                font-size: 11px;
            }

            /* ---------- SEARCH RESULTS ---------- */

            #view-search-results {
                width: 100%;
                max-width: 100vw;
                padding: 17px 12px 28px !important;

                overflow-y: auto;
                overflow-x: hidden;

                -webkit-overflow-scrolling: touch;
            }

            #view-search-results > div:first-child {
                gap: 9px !important;
                margin-bottom: 16px !important;
            }

            #results-container {
                width: 100%;
                display: flex;
                flex-direction: column;
                gap: 11px !important;
            }

            #results-container > div {
                width: 100%;
                padding: 14px !important;
                border-radius: 12px !important;
                overflow-wrap: anywhere;
            }

            #results-container h3 {
                font-size: 16px !important;
                line-height: 1.35;
            }

            #results-container p {
                font-size: 12px !important;
                line-height: 1.55;
            }

            /* ---------- WEBSITE VIEW ---------- */

            #view-website {
                width: 100%;
                min-width: 0;
                min-height: 100% !important;

                overflow-x: hidden;
                overflow-y: auto;

                -webkit-overflow-scrolling: touch;
            }

            #website-content {
                width: 100%;
                min-height: 100%;
                overflow-x: hidden;
            }

            /* ---------- SETTINGS ---------- */

            /*
             * On desktop this remains the original right sidebar.
             * On mobile it becomes a bottom sheet.
             */

            #settings-sidebar {
                width: 100% !important;
                max-width: 100vw;

                height: min(78vh, 620px) !important;

                top: auto !important;
                bottom: 0 !important;
                right: 0 !important;

                border-left: 0 !important;
                border-top: 1px solid #333 !important;

                border-radius: 17px 17px 0 0;

                transform: translateY(100%);
            }

            #settings-sidebar:not(.translate-x-full) {
                transform: translateY(0);
            }

            #settings-sidebar .p-4 {
                padding: 14px !important;
            }

            #settings-sidebar h2 {
                font-size: 16px;
            }

            #settings-sidebar .space-y-6 {
                gap: 15px;
            }

            /* ---------- TOUCH ---------- */

            button,
            a,
            input {
                -webkit-tap-highlight-color: transparent;
            }

            button {
                touch-action: manipulation;
            }

            input {
                touch-action: manipulation;
            }
        }

        /* =========================================================
           SMALL PHONES
           ========================================================= */

        @media (max-width: 420px) {

            header {
                min-height: 51px;
                padding: 6px !important;
            }

            header > div:first-child button {
                padding: 5px !important;
            }

            #address-bar {
                height: 36px;
                font-size: 11px !important;
                padding-left: 34px !important;
            }

            header > div:last-child button {
                padding: 5px !important;
            }

            header > div:last-child img {
                width: 23px !important;
                height: 23px !important;
            }

            #view-home {
                padding-left: 10px !important;
                padding-right: 10px !important;
            }

            #view-home > div:first-child {
                margin-top: 5vh;
                margin-bottom: 22px !important;
            }

            #view-home > div:first-child > div {
                font-size: 29px !important;
            }

            #view-home > div:first-child > span {
                font-size: 20px !important;
            }

            #main-search {
                height: 49px;
                font-size: 13px !important;
                padding-left: 44px !important;
            }

            #view-home > div:nth-child(3) {
                margin-top: 18px !important;
                gap: 7px !important;
            }

            #view-home > div:nth-child(3) > div {
                min-width: 70px;
            }

            #view-home > div:nth-child(3) > div > div {
                width: 46px !important;
                height: 46px !important;
            }
        }

        /* =========================================================
           LANDSCAPE PHONE
           ========================================================= */

        @media (max-width: 768px) and (orientation: landscape) {

            #view-home {
                padding-top: 10px !important;
            }

            #view-home > div:first-child {
                margin-top: 2vh;
                margin-bottom: 13px !important;
            }

            #view-home > div:first-child > div {
                font-size: 26px !important;
            }

            #view-home > div:first-child > span {
                font-size: 18px !important;
            }

            #main-search {
                height: 45px;
            }
        }
    </style>
<style id="jsmini-live-deployment">
/* JS mini.Browser live deployment additions — existing Marvel palette intentionally preserved. */
.jsmini-modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.78);backdrop-filter:blur(8px);z-index:100000;display:flex;align-items:center;justify-content:center;padding:18px}
.jsmini-modal{width:min(560px,100%);max-height:90vh;overflow:auto;background:#151515;border:1px solid #333;border-top:3px solid #E23636;border-radius:16px;box-shadow:0 24px 80px rgba(0,0,0,.65);padding:22px}
.jsmini-modal h2{font-size:22px;font-weight:900;margin:0 0 5px}.jsmini-muted{color:#9ca3af;font-size:12px}.jsmini-label{display:block;font-size:11px;color:#d1d5db;font-weight:800;text-transform:uppercase;letter-spacing:.08em;margin:16px 0 7px}
.jsmini-input,.jsmini-textarea,.jsmini-select{width:100%;background:#0f0f0f;border:1px solid #3f3f46;color:#fff;border-radius:10px;padding:11px 12px;outline:none;font-size:13px}.jsmini-input:focus,.jsmini-textarea:focus,.jsmini-select:focus{border-color:#E23636;box-shadow:0 0 0 2px rgba(226,54,54,.15)}.jsmini-textarea{min-height:90px;resize:vertical}
.jsmini-domain-wrap{display:flex;align-items:center}.jsmini-domain-wrap .jsmini-input{border-radius:10px 0 0 10px}.jsmini-domain-suffix{background:#202A44;border:1px solid #3f3f46;border-left:0;padding:11px 12px;border-radius:0 10px 10px 0;color:#F78F3F;font-weight:800;font-size:12px;white-space:nowrap}
.jsmini-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}.jsmini-btn{border:0;border-radius:10px;padding:10px 15px;font-size:12px;font-weight:900;cursor:pointer}.jsmini-btn.cancel{background:#262626;color:#d1d5db}.jsmini-btn.deploy{background:#E23636;color:#fff;box-shadow:0 5px 18px rgba(226,54,54,.25)}.jsmini-btn.deploy:hover{background:#b91c1c}.jsmini-status{margin-top:12px;font-size:12px;min-height:18px}.jsmini-success{color:#86efac}.jsmini-error{color:#fca5a5}.jsmini-loading{color:#F78F3F}
.jsmini-sitebar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;background:#111;border-bottom:1px solid #333}.jsmini-sitebar strong{font-size:12px}.jsmini-sitebar span{font-size:10px;color:#9ca3af}.jsmini-open-frame{width:100%;height:calc(100vh - 100px);border:0;background:#fff;display:block}
.jsmini-sites-section{width:min(900px,100%);margin:30px auto 0;padding:0 8px}.jsmini-sites-title{font-size:13px;color:#9ca3af;text-transform:uppercase;letter-spacing:.12em;margin-bottom:12px;font-weight:900}.jsmini-sites-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.jsmini-site-card{background:#151515;border:1px solid #333;border-radius:12px;padding:15px;text-align:left;cursor:pointer;transition:.2s}.jsmini-site-card:hover{border-color:#E23636;transform:translateY(-2px)}.jsmini-site-card h3{font-size:15px;font-weight:900;margin:0 0 5px}.jsmini-site-card p{font-size:11px;color:#9ca3af;line-height:1.5;margin:0 0 9px}.jsmini-site-card .domain{font-size:10px;color:#F78F3F;font-weight:800}
@media(max-width:600px){.jsmini-modal{padding:17px;border-radius:13px}.jsmini-actions{flex-direction:column-reverse}.jsmini-btn{width:100%}.jsmini-sitebar{padding:8px 10px}.jsmini-open-frame{height:calc(100vh - 96px)}}
</style>


<style id="jsmini-chrome-experience">
/* Chrome-like motion and account/history surfaces; existing palette is intentionally unchanged. */
.jsmini-account-menu{position:fixed;z-index:100050;width:320px;background:#151515;border:1px solid #333;border-radius:16px;box-shadow:0 18px 55px rgba(0,0,0,.65);padding:8px;transform-origin:top right;animation:jsminiMenuIn .16s ease-out}
.jsmini-account-head{display:flex;align-items:center;gap:12px;padding:12px;border-bottom:1px solid #333;margin-bottom:6px}
.jsmini-account-head img{width:44px;height:44px;border-radius:50%;background:#202A44;border:2px solid #333}
.jsmini-account-head strong{display:block;font-size:14px;color:#fff;max-width:210px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jsmini-account-head span{display:block;font-size:11px;color:#9ca3af;max-width:210px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.jsmini-account-menu button{width:100%;display:flex;align-items:center;gap:12px;background:transparent;border:0;color:#ddd;padding:11px 12px;border-radius:10px;cursor:pointer;text-align:left;font-size:13px;transition:background .14s,transform .14s}
.jsmini-account-menu button:hover{background:#202A44;color:#fff;transform:translateX(2px)}
.jsmini-account-menu button svg{width:17px;height:17px;color:#F78F3F}
.jsmini-menu-sep{height:1px;background:#333;margin:6px 4px}
.jsmini-history-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(7px);z-index:100040;display:flex;justify-content:flex-end}
.jsmini-history-panel{height:100%;width:min(520px,100%);background:#111;border-left:1px solid #333;box-shadow:-20px 0 60px rgba(0,0,0,.5);animation:jsminiPanelIn .2s ease-out;display:flex;flex-direction:column}
.jsmini-history-head{height:auto!important;min-height:76px;background:#1a1a1a!important;border:0!important;border-bottom:1px solid #333!important;display:flex;align-items:center;justify-content:space-between;padding:16px 18px}
.jsmini-history-head h2{font-size:20px;font-weight:900;margin:0;color:#fff}
.jsmini-history-head span{display:block;font-size:11px;color:#9ca3af;margin-top:3px}
.jsmini-history-head button{background:transparent;border:0;color:#aaa;font-size:28px;line-height:1;cursor:pointer;padding:5px 8px;border-radius:8px}
.jsmini-history-head button:hover{background:#202A44;color:#fff}
.jsmini-history-toolbar{display:flex;gap:8px;padding:12px;border-bottom:1px solid #292929}
.jsmini-history-toolbar input{flex:1;min-width:0;background:#151515;border:1px solid #3a3a3a;color:#fff;border-radius:10px;padding:10px 12px;outline:0}
.jsmini-history-toolbar input:focus{border-color:#E23636;box-shadow:0 0 0 2px rgba(226,54,54,.12)}
.jsmini-history-toolbar button{background:#202A44;color:#fff;border:0;border-radius:10px;padding:8px 11px;font-size:11px;font-weight:800;cursor:pointer}
.jsmini-history-toolbar button:hover{background:#E23636}
#jsmini-history-list{overflow:auto;padding:8px;flex:1}
.jsmini-history-row{width:100%;display:flex;align-items:center;gap:11px;border:0;background:transparent;color:#fff;text-align:left;padding:11px 9px;border-radius:11px;cursor:pointer;transition:background .14s,transform .14s}
.jsmini-history-row:hover{background:#1b1b1b;transform:translateX(2px)}
.jsmini-history-icon{width:34px;height:34px;border-radius:50%;background:#202A44;display:grid;place-items:center;flex:none}
.jsmini-history-icon svg{width:16px;height:16px;color:#F78F3F}
.jsmini-history-main{min-width:0;flex:1}
.jsmini-history-main strong,.jsmini-history-main small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jsmini-history-main strong{font-size:12px;font-weight:800}
.jsmini-history-main small{font-size:10px;color:#888;margin-top:3px}
.jsmini-history-row time{font-size:9px;color:#777;white-space:nowrap}
.jsmini-history-empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#777;text-align:center;gap:7px}
.jsmini-history-empty svg{width:44px;height:44px;color:#202A44}
.jsmini-history-empty strong{color:#ddd;font-size:14px}
.jsmini-history-empty span{font-size:11px}
header button:disabled{cursor:default!important}
#view-home,#view-search-results,#view-website{animation-duration:.18s}
.fade-in{animation:jsminiViewIn .18s ease-out}
.jsmini-modal-backdrop:not(.hidden){animation:jsminiBackdropIn .16s ease-out}
.jsmini-modal-backdrop:not(.hidden) .jsmini-modal{animation:jsminiModalIn .2s cubic-bezier(.2,.8,.2,1)}
.jsmini-site-card{transition:transform .16s ease,border-color .16s ease,box-shadow .16s ease}
.jsmini-site-card:hover{box-shadow:0 10px 30px rgba(0,0,0,.28)}
@keyframes jsminiViewIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@keyframes jsminiBackdropIn{from{opacity:0}to{opacity:1}}
@keyframes jsminiModalIn{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
@keyframes jsminiMenuIn{from{opacity:0;transform:translateY(-5px) scale(.98)}to{opacity:1;transform:none}}
@keyframes jsminiPanelIn{from{opacity:.5;transform:translateX(25px)}to{opacity:1;transform:none}}
@media(max-width:600px){
 .jsmini-account-menu{width:min(340px,calc(100vw - 16px));right:8px!important}
 .jsmini-history-panel{width:100%;border-left:0}
 .jsmini-history-toolbar{flex-wrap:wrap}
 .jsmini-history-toolbar input{flex-basis:100%}
}
</style>

</head>

<body class="h-screen w-full bg-marvelDark text-white overflow-hidden flex flex-col font-sans">

    <!-- Browser Window Header / Toolbar -->
    <header class="bg-[#0a0a0a] border-b-2 border-marvelRed p-2 flex items-center justify-between shadow-md z-20">

        <!-- Window Controls & Navigation -->
        <div class="flex items-center gap-2">

            <div class="flex gap-1.5 mr-4 px-2">
                <div class="w-3 h-3 rounded-full bg-red-500"></div>
                <div class="w-3 h-3 rounded-full bg-yellow-500"></div>
                <div class="w-3 h-3 rounded-full bg-green-500"></div>
            </div>

            <button
                onclick="goHome()"
                class="p-1.5 rounded hover:bg-gray-800 text-gray-400 hover:text-white transition"
                title="Home">
                <i data-lucide="home" class="w-5 h-5"></i>
            </button>

            <button
                onclick="alert('Back kora abosthay nai (Feature coming soon)')"
                class="p-1.5 rounded hover:bg-gray-800 text-gray-400 hover:text-white transition">
                <i data-lucide="arrow-left" class="w-5 h-5"></i>
            </button>

            <button
                class="p-1.5 rounded hover:bg-gray-800 text-gray-400 hover:text-white transition">
                <i data-lucide="arrow-right" class="w-5 h-5"></i>
            </button>

            <button
                onclick="refreshPage()"
                class="p-1.5 rounded hover:bg-gray-800 text-gray-400 hover:text-white transition">
                <i data-lucide="rotate-cw" class="w-5 h-5"></i>
            </button>
        </div>

        <!-- Address Bar -->
        <div class="flex-1 max-w-3xl mx-4 relative group">

            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                <i data-lucide="search" class="w-4 h-4 text-marvelGold"></i>
            </div>

            <input
                type="text"
                id="address-bar"
                class="w-full bg-[#1a1a1a] border border-gray-700 text-white rounded-full py-1.5 pl-10 pr-4 focus:outline-none focus:border-marvelRed focus:ring-1 focus:ring-marvelRed transition shadow-inner"
                placeholder="Search or enter a .JS URL..."
                onkeydown="handleAddressBarEnter(event)">
        </div>

        <!-- Extensions & Settings -->
        <div class="flex items-center gap-2">

            <div class="h-6 w-px bg-gray-700 mx-1"></div>

            <button
                class="p-1.5 rounded hover:bg-gray-800 text-gray-400 hover:text-marvelGold transition"
                title="Extensions">
                <i data-lucide="puzzle" class="w-5 h-5"></i>
            </button>

            <button
                class="p-1.5 rounded hover:bg-gray-800 text-gray-400 hover:text-white transition">
                <img
                    src="https://api.dicebear.com/7.x/avataaars/svg?seed=Marvel"
                    alt="User"
                    class="w-6 h-6 rounded-full bg-gray-600">
            </button>

            <button
                onclick="toggleSettings()"
                class="p-1.5 rounded hover:bg-gray-800 text-gray-400 hover:text-white transition"
                title="Settings">
                <i data-lucide="more-vertical" class="w-5 h-5"></i>
            </button>
        </div>
    </header>

    <!-- Main Browser Content Area -->
    <main class="flex-1 flex relative overflow-hidden">

        <!-- Tab Content Area -->
        <div
            id="viewport"
            class="flex-1 overflow-y-auto marvel-bg flex flex-col relative w-full">

            <!-- Home Screen -->
            <div
                id="view-home"
                class="flex-1 flex flex-col items-center justify-center p-8 fade-in">

                <div class="text-center mb-8">

                    <div class="bg-marvelRed text-white font-black text-5xl tracking-tighter px-4 py-2 inline-block shadow-lg uppercase">
                        JS mini
                    </div>

                    <span class="text-gray-300 text-3xl font-light ml-2 tracking-wide block mt-2">
                        .Browser
                    </span>
                </div>

                <div class="w-full max-w-2xl relative">

                    <i
                        data-lucide="search"
                        class="absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400 w-6 h-6">
                    </i>

                    <input
                        type="text"
                        id="main-search"

                    loadSite(query);
                } else {
                    executeSearch(query);

            }

            if (!query) return;

            document
                .getElementById('address-bar')

            document
                .getElementById('search-query-text')
                .innerText = query;

            const resultsContainer =
                document.getElementById('results-container');

            resultsContainer.innerHTML = '';

            query = query.toLowerCase();

            const matches =
                mockDatabase.filter(site =>

                    site.title
                        .toLowerCase()
                        .includes(query) ||

                    site.url
                        .toLowerCase()
                        .includes(query) ||

                    site.snippet
                        .toLowerCase()
                        .includes(query)
                );

                matches.forEach(site => {

                        document.createElement('div');

function buildJSMiniStandalone(files){

/* =========================================================
   CHROME-LIKE BROWSER EXPERIENCE
   Persistent account history + local fallback + navigation UI.
   Existing features and Marvel palette remain unchanged.
   ========================================================= */
const JSMINI_LOCAL_HISTORY_KEY='jsmini-browser-history-v2';
let jsMiniHistoryLoaded=false;
let jsMiniHistorySyncing=false;

function jsMiniHistoryReadLocal(){
  try{return JSON.parse(localStorage.getItem(JSMINI_LOCAL_HISTORY_KEY)||'[]');}catch(e){return [];}
}
function jsMiniHistoryWriteLocal(){
  try{localStorage.setItem(JSMINI_LOCAL_HISTORY_KEY,JSON.stringify(jsMiniHistory.slice(-100)));}catch(e){}
}
async function jsMiniHistoryLoad(){
  if(jsMiniHistoryLoaded)return;
  jsMiniHistoryLoaded=true;
  const local=jsMiniHistoryReadLocal();
  jsMiniHistory=Array.isArray(local)?local:[];
  jsMiniHistoryIndex=jsMiniHistory.length-1;
  if(jsMiniUser && !jsMiniUser.isAnonymous){
    try{
      const snap=await getDoc(doc(jsMiniDb,'users',jsMiniUser.uid,'browser','history'));
      if(snap.exists()){
        const cloud=Array.isArray(snap.data().items)?snap.data().items:[];
        if(cloud.length) jsMiniHistory=cloud.slice(-100);
        jsMiniHistoryIndex=jsMiniHistory.length-1;
        jsMiniHistoryWriteLocal();
      }
    }catch(e){console.warn('Browser history sync read failed:',e);}
  }
  updateJSMiniNavigationUI();
  renderJSMiniHistory();
}
async function jsMiniHistorySave(){
  jsMiniHistoryWriteLocal();
  if(!jsMiniUser || jsMiniUser.isAnonymous || jsMiniHistorySyncing)return;
  jsMiniHistorySyncing=true;
  try{
    await setDoc(doc(jsMiniDb,'users',jsMiniUser.uid,'browser','history'),{
      items:jsMiniHistory.slice(-100),
      updatedAt:Date.now()
    },{merge:true});
  }catch(e){console.warn('Browser history sync write failed:',e);}
  finally{jsMiniHistorySyncing=false;}
}
function jsMiniRecordHistory(entry){
  if(!entry)return;
  const value=typeof entry==='string'?entry:entry.url;
  if(!value)return;
  const item={url:String(value),title:String((entry&&entry.title)||value),type:String((entry&&entry.type)||'website'),visitedAt:Date.now()};
  const last=jsMiniHistory[jsMiniHistory.length-1];
  if(last && last.url===item.url){
    jsMiniHistory[jsMiniHistory.length-1]={...last,...item};
    jsMiniHistoryIndex=jsMiniHistory.length-1;
  }else{
    jsMiniHistory=jsMiniHistory.slice(0,jsMiniHistoryIndex+1);
    jsMiniHistory.push(item);
    jsMiniHistory=jsMiniHistory.slice(-100);
    jsMiniHistoryIndex=jsMiniHistory.length-1;
  }
  jsMiniHistoryWriteLocal();
  jsMiniHistorySave();
  updateJSMiniNavigationUI();
  renderJSMiniHistory();
}
function updateJSMiniNavigationUI(){
  const buttons=document.querySelectorAll('header > div:first-child button');
  if(buttons.length>=5){
    const back=buttons[2], forward=buttons[3];
    back.onclick=()=>window.goJSMiniBack();
    forward.onclick=()=>window.goJSMiniForward();
    back.disabled=jsMiniHistoryIndex<=0;
    forward.disabled=jsMiniHistoryIndex<0 || jsMiniHistoryIndex>=jsMiniHistory.length-1;
    back.style.opacity=back.disabled?'.35':'1';
    forward.style.opacity=forward.disabled?'.35':'1';
    back.title='Back';
    forward.title='Forward';
  }
}
