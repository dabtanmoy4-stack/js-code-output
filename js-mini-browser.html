<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS mini.Browser</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        marvelRed: '#E23636',
                        marvelDark: '#151515',
                        marvelBlue: '#202A44',
                        marvelGold: '#F78F3F'
                    }
                }
            }
        }
    </script>

    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #151515;
        }

        ::-webkit-scrollbar-thumb {
            background: #202A44;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #E23636;
        }

        .marvel-bg {
            background: radial-gradient(
                circle at center,
                #202A44 0%,
                #151515 100%
            );
        }

        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {

            html,
            body {
                width: 100%;
                height: 100%;
                min-width: 0;
                overflow: hidden;
            }

            body {
                font-size: 14px;
            }

            header {
                min-height: 55px;
                height: auto;
                padding: 7px 6px !important;
                gap: 5px;
                flex-wrap: nowrap;
            }

            header > div:first-child > div:first-child {
                margin-right: 1px !important;
                padding-left: 2px !important;
                padding-right: 2px !important;
                gap: 3px !important;
            }

            header > div:first-child > div:first-child div {
                width: 7px !important;
                height: 7px !important;
            }

            header > div:first-child {
                gap: 1px !important;
                flex-shrink: 0;
            }

            header > div:first-child button {
                padding: 6px !important;
            }

            header > div:first-child button:nth-of-type(2),
            header > div:first-child button:nth-of-type(3) {
                display: none;
            }

            header > div.flex-1 {
                min-width: 0;
                max-width: none !important;
                margin-left: 3px !important;
                margin-right: 3px !important;
            }

            #address-bar {
                width: 100%;
                min-width: 0;
                height: 38px;
                padding-top: 7px !important;
                padding-bottom: 7px !important;
                padding-left: 37px !important;
                padding-right: 9px !important;
                font-size: 12px !important;
                border-radius: 12px !important;
            }

            header > div:last-child {
                gap: 1px !important;
                flex-shrink: 0;
            }

            header > div:last-child .h-6 {
                display: none;
            }

            header > div:last-child button:first-of-type {
                display: none;
            }

            header > div:last-child button {
                padding: 6px !important;
            }

            header > div:last-child img {
                width: 25px !important;
                height: 25px !important;
            }

            #viewport {
                width: 100%;
                max-width: 100vw;
                overflow-x: hidden;
            }

            #view-home {
                width: 100%;
                min-width: 0;
                padding: 25px 13px 30px !important;
                justify-content: flex-start !important;
                overflow-y: auto;
                overflow-x: hidden;
                -webkit-overflow-scrolling: touch;
            }

            #view-home > div:first-child {
                width: 100%;
                margin-top: 8vh;
                margin-bottom: 25px !important;
            }

            #view-home > div:first-child > div {
                font-size: 34px !important;
                line-height: 1.1;
                padding: 8px 12px !important;
            }

            #view-home > div:first-child > span {
                display: block;
                margin-left: 0 !important;
                margin-top: 8px !important;
                font-size: 23px !important;
            }

            #view-home > div:nth-child(2) {
                width: 100%;
                max-width: 100%;
            }

            #main-search {
                width: 100%;
                height: 53px;
                padding-left: 48px !important;
                padding-right: 14px !important;
                font-size: 14px !important;
                border-radius: 14px !important;
            }

            #view-home > div:nth-child(3) {
                width: 100%;
                margin-top: 22px !important;
                display: flex;
                justify-content: center;
                align-items: center;
                gap: 10px !important;
                flex-wrap: wrap;
            }

            #view-home > div:nth-child(3) > div {
                min-width: 76px;
            }

            #view-home > div:nth-child(3) > div > div {
                width: 50px !important;
                height: 50px !important;
            }

            #view-home > div:nth-child(3) > div > span {
                font-size: 11px;
            }

            #view-search-results {
                width: 100%;
                max-width: 100vw;
                padding: 17px 12px 28px !important;
                overflow-y: auto;
                overflow-x: hidden;
                -webkit-overflow-scrolling: touch;
            }

            #view-search-results > div:first-child {
                gap: 9px !important;
                margin-bottom: 16px !important;
            }

            #results-container {
                width: 100%;
                display: flex;
                flex-direction: column;
                gap: 11px !important;
            }

            #results-container > div {
                width: 100%;
                padding: 14px !important;
                border-radius: 12px !important;
                overflow-wrap: anywhere;
            }

            #results-container h3 {
                font-size: 16px !important;
                line-height: 1.35;
            }

            #results-container p {
                font-size: 12px !important;
                line-height: 1.55;
            }

            #view-website {
                width: 100%;
                min-width: 0;
                min-height: 100% !important;
                overflow-x: hidden;
                overflow-y: auto;
                -webkit-overflow-scrolling: touch;
            }

            #website-content {
                width: 100%;
                min-height: 100%;
                overflow-x: hidden;
            }

            #settings-sidebar {
                width: 100% !important;
                max-width: 100vw;
                height: min(78vh, 620px) !important;
                top: auto !important;
                bottom: 0 !important;
                right: 0 !important;
                border-left: 0 !important;
                border-top: 1px solid #333 !important;
                border-radius: 17px 17px 0 0;
                transform: translateY(100%);
            }

            #settings-sidebar:not(.translate-x-full) {
                transform: translateY(0);
            }

            #settings-sidebar .p-4 {
                padding: 14px !important;
            }

            #settings-sidebar h2 {
                font-size: 16px;
            }

            #settings-sidebar .space-y-6 {
                gap: 15px;
            }

            button,
            a,
            input {
                -webkit-tap-highlight-color: transparent;
            }

            button {
                touch-action: manipulation;
            }

            input {
                touch-action: manipulation;
            }
        }

        @media (max-width: 420px) {

            header {
                min-height: 51px;
                padding: 6px !important;
            }

            header > div:first-child button {
                padding: 5px !important;
            }

            #address-bar {
                height: 36px;
                font-size: 11px !important;
                padding-left: 34px !important;
            }

            header > div:last-child button {
                padding: 5px !important;
            }

            header > div:last-child img {
                width: 23px !important;
                height: 23px !important;
            }

            #view-home {
                padding-left: 10px !important;
                padding-right: 10px !important;
            }

            #view-home > div:first-child {
                margin-top: 5vh;
                margin-bottom: 22px !important;
            }

            #view-home > div:first-child > div {
                font-size: 29px !important;
            }

            #view-home > div:first-child > span {
                font-size: 20px !important;
            }

            #main-search {
                height: 49px;
                font-size: 13px !important;
                padding-left: 44px !important;
            }

            #view-home > div:nth-child(3) {
                margin-top: 18px !important;
                gap: 7px !important;
            }

            #view-home > div:nth-child(3) > div {
                min-width: 70px;
            }

            #view-home > div:nth-child(3) > div > div {
                width: 46px !important;
                height: 46px !important;
            }
        }

        @media (max-width: 768px) and (orientation: landscape) {

            #view-home {
                padding-top: 10px !important;
            }

            #view-home > div:first-child {
                margin-top: 2vh;
                margin-bottom: 13px !important;
            }

            #view-home > div:first-child > div {
                font-size: 26px !important;
            }

            #view-home > div:first-child > span {
                font-size: 18px !important;
            }

            #main-search {
                height: 45px;
            }
        }
    </style>

    <style id="jsmini-live-deployment">
        .jsmini-modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.78);
            backdrop-filter: blur(8px);
            z-index: 100000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 18px
        }

        .jsmini-modal {
            width: min(560px,100%);
            max-height: 90vh;
            overflow: auto;
            background: #151515;
            border: 1px solid #333;
            border-top: 3px solid #E23636;
            border-radius: 16px;
            box-shadow: 0 24px 80px rgba(0,0,0,.65);
            padding: 22px
        }

        .jsmini-modal h2 {
            font-size: 22px;
            font-weight: 900;
            margin: 0 0 5px
        }

        .jsmini-muted {
            color: #9ca3af;
            font-size: 12px
        }

        .jsmini-label {
            display: block;
            font-size: 11px;
            color: #d1d5db;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: .08em;
            margin: 16px 0 7px
        }

        .jsmini-input,
        .jsmini-textarea,
        .jsmini-select {
            width: 100%;
            background: #0f0f0f;
            border: 1px solid #3f3f46;
            color: #fff;
            border-radius: 10px;
            padding: 11px 12px;
            outline: none;
            font-size: 13px
        }

        .jsmini-input:focus,
        .jsmini-textarea:focus,
        .jsmini-select:focus {
            border-color: #E23636;
            box-shadow: 0 0 0 2px rgba(226,54,54,.15)
        }

        .jsmini-textarea {
            min-height: 90px;
            resize: vertical
        }

        .jsmini-domain-wrap {
            display: flex;
            align-items: center
        }

        .jsmini-domain-wrap .jsmini-input {
            border-radius: 10px 0 0 10px
        }

        .jsmini-domain-suffix {
            background: #202A44;
            border: 1px solid #3f3f46;
            border-left: 0;
            padding: 11px 12px;
            border-radius: 0 10px 10px 0;
            color: #F78F3F;
            font-weight: 800;
            font-size: 12px;
            white-space: nowrap
        }

        .jsmini-actions {
            display: flex;
            justify-content: flex-end;
            gap: 9px;
            margin-top: 20px
        }

        .jsmini-btn {
            border: 0;
            border-radius: 10px;
            padding: 10px 15px;
            font-size: 12px;
            font-weight: 900;
            cursor: pointer
        }

        .jsmini-btn.cancel {
            background: #262626;
            color: #d1d5db
        }

        .jsmini-btn.deploy {
            background: #E23636;
            color: #fff;
            box-shadow: 0 5px 18px rgba(226,54,54,.25)
        }

        .jsmini-btn.deploy:hover {
            background: #b91c1c
        }

        .jsmini-status {
            margin-top: 12px;
            font-size: 12px;
            min-height: 18px
        }

        .jsmini-success {
            color: #86efac
        }

        .jsmini-error {
            color: #fca5a5
        }

        .jsmini-loading {
            color: #F78F3F
        }

        .jsmini-sitebar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 10px 14px;
            background: #111;
            border-bottom: 1px solid #333
        }

        .jsmini-sitebar strong {
            font-size: 12px
        }

        .jsmini-sitebar span {
            font-size: 10px;
            color: #9ca3af
        }

        .jsmini-open-frame {
            width: 100%;
            height: calc(100vh - 100px);
            border: 0;
            background: #fff;
            display: block
        }

        .jsmini-sites-section {
            width: min(900px,100%);
            margin: 30px auto 0;
            padding: 0 8px
        }

        .jsmini-sites-title {
            font-size: 13px;
            color: #9ca3af;
            text-transform: uppercase;
            letter-spacing: .12em;
            margin-bottom: 12px;
            font-weight: 900
        }

        .jsmini-sites-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit,minmax(220px,1fr));
            gap: 12px
        }

        .jsmini-site-card {
            background: #151515;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 15px;
            text-align: left;
            cursor: pointer;
            transition: .2s
        }

        .jsmini-site-card:hover {
            border-color: #E23636;
            transform: translateY(-2px)
        }

        .jsmini-site-card h3 {
            font-size: 15px;
            font-weight: 900;
            margin: 0 0 5px
        }

        .jsmini-site-card p {
            font-size: 11px;
            color: #9ca3af;
            line-height: 1.5;
            margin: 0 0 9px
        }

        .jsmini-site-card .domain {
            font-size: 10px;
            color: #F78F3F;
            font-weight: 800
        }

        @media(max-width:600px) {
            .jsmini-modal {
                padding: 17px;
                border-radius: 13px
            }

            .jsmini-actions {
                flex-direction: column-reverse
            }

            .jsmini-btn {
                width: 100%
            }

            .jsmini-sitebar {
                padding: 8px 10px
            }

            .jsmini-open-frame {
                height: calc(100vh - 96px)
            }
        }
    </style>
</head>

<body class="h-screen w-full bg-marvelDark text-white overflow-hidden flex flex-col font-sans">

    <header class="bg-[#0a0a0a] border-b-2 border-marvelRed p-2 flex items-center justify-between shadow-md z-20">

        <div class="flex items-center gap-2">

            <div class="flex gap-1.5 mr-4 px-2">
                <div class="w-3 h-3 rounded-full bg-red-500"></div>
                <div class="w-3 h-3 rounded-full bg-yellow-500"></div>
                <div class="w-3 h-3 rounded-full bg-green-500"></div>
            </div>

            <button
                onclick="goHome()"
                class="p-1.5 rounded hover:bg-gray-800 text-gray-400 hover:text-white transition"
                title="Home">
                <i data-lucide="home" class="w-5 h-5"></i>
            </button>

            <button
                onclick="goJSMiniBack()"
                class="p-1.5 rounded hover:bg-gray-800 text-gray-400 hover:text-white transition"
                title="Back">
                <i data-lucide="arrow-left" class="w-5 h-5"></i>
            </button>

            <button
                onclick="goJSMiniForward()"
                class="p-1.5 rounded hover:bg-gray-800 text-gray-400 hover:text-white transition"
                title="Forward">
                <i data-lucide="arrow-right" class="w-5 h-5"></i>
            </button>

            <button
                onclick="refreshPage()"
                class="p-1.5 rounded hover:bg-gray-800 text-gray-400 hover:text-white transition"
                title="Refresh">
                <i data-lucide="rotate-cw" class="w-5 h-5"></i>
            </button>
        </div>

        <div class="flex-1 max-w-3xl mx-4 relative group">

            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                <i data-lucide="search" class="w-4 h-4 text-marvelGold"></i>
            </div>

            <input
                type="text"
                id="address-bar"
                class="w-full bg-[#1a1a1a] border border-gray-700 text-white rounded-full py-1.5 pl-10 pr-4 focus:outline-none focus:border-marvelRed focus:ring-1 focus:ring-marvelRed transition shadow-inner"
                placeholder="Search or enter a .JS URL..."
                onkeydown="handleAddressBarEnter(event)">
        </div>

        <div class="flex items-center gap-2">

            <div class="h-6 w-px bg-gray-700 mx-1"></div>

            <button
                class="p-1.5 rounded hover:bg-gray-800 text-gray-400 hover:text-marvelGold transition"
                title="Extensions">
                <i data-lucide="puzzle" class="w-5 h-5"></i>
            </button>

            <!-- yt.jpeg logo -->
            <button
                class="p-1.5 rounded hover:bg-gray-800 text-gray-400 hover:text-white transition"
                title="Account">
                <img
                    src="./yt.jpeg"
                    alt="User"
                    class="w-6 h-6 rounded-full bg-gray-600 object-cover">
            </button>

            <button
                onclick="toggleSettings()"
                class="p-1.5 rounded hover:bg-gray-800 text-gray-400 hover:text-white transition"
                title="Settings">
                <i data-lucide="more-vertical" class="w-5 h-5"></i>
            </button>
        </div>
    </header>

    <main class="flex-1 flex relative overflow-hidden">

        <div
            id="viewport"
            class="flex-1 overflow-y-auto marvel-bg flex flex-col relative w-full">

            <div
                id="view-home"
                class="flex-1 flex flex-col items-center justify-center p-8 fade-in">

                <div class="text-center mb-8">

                    <div class="bg-marvelRed text-white font-black text-5xl tracking-tighter px-4 py-2 inline-block shadow-lg uppercase">
                        JS mini
                    </div>

                    <span class="text-gray-300 text-3xl font-light ml-2 tracking-wide block mt-2">
                        .Browser
                    </span>
                </div>

                <div class="w-full max-w-2xl relative">

                    <i
                        data-lucide="search"
                        class="absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400 w-6 h-6">
                    </i>

                    <input
                        type="text"
                        id="main-search"
                        class="w-full bg-[#151515] bg-opacity-80 border-2 border-gray-700 text-white rounded-full py-4 pl-14 pr-6 text-lg focus:outline-none focus:border-marvelRed focus:ring-4 focus:ring-red-900/50 shadow-2xl transition-all"
                        placeholder="Search for alien tech or .JS websites from around the world..."
                        onkeydown="if(event.key === 'Enter') executeSearch(this.value)">
                </div>

                <div class="flex gap-4 mt-8">

                    <div
                        class="flex flex-col items-center gap-2 cursor-pointer group"
                        onclick="loadSite('stark.JS')">

                        <div class="w-14 h-14 bg-gray-800 rounded-lg flex items-center justify-center group-hover:bg-marvelRed transition shadow-md border border-gray-700">
                            <i data-lucide="cpu" class="text-marvelGold w-7 h-7"></i>
                        </div>

                        <span class="text-sm text-gray-400 group-hover:text-white">
                            stark.JS
                        </span>
                    </div>

                    <div
                        class="flex flex-col items-center gap-2 cursor-pointer group"
                        onclick="loadSite('shield.JS')">

                        <div class="w-14 h-14 bg-gray-800 rounded-lg flex items-center justify-center group-hover:bg-marvelBlue transition shadow-md border border-gray-700">
                            <i data-lucide="shield" class="text-gray-300 w-7 h-7"></i>
                        </div>

                        <span class="text-sm text-gray-400 group-hover:text-white">
                            shield.JS
                        </span>
                    </div>

                    <div
                        class="flex flex-col items-center gap-2 cursor-pointer group"
                        onclick="loadSite('wakanda.JS')">

                        <div class="w-14 h-14 bg-gray-800 rounded-lg flex items-center justify-center group-hover:bg-purple-800 transition shadow-md border border-gray-700">
                            <i data-lucide="globe" class="text-gray-300 w-7 h-7"></i>
                        </div>

                        <span class="text-sm text-gray-400 group-hover:text-white">
                            wakanda.JS
                        </span>
                    </div>
                </div>
            </div>

            <div
                id="view-search-results"
                class="hidden w-full max-w-4xl mx-auto p-8 fade-in flex-1">

                <div class="flex items-center gap-4 mb-6 border-b border-gray-800 pb-4">

                    <div class="bg-marvelRed text-white font-bold text-xl px-2 py-1">
                        JS
                    </div>

                    <span class="text-gray-400">
                        Search results for:
                        <span
                            id="search-query-text"
                            class="text-white font-medium">
                        </span>
                    </span>
                </div>

                <div
                    id="results-container"
                    class="space-y-6">
                </div>
            </div>

            <div
                id="view-website"
                class="hidden bg-white text-black w-full min-h-full fade-in relative">

                <div
                    id="website-content"
                    class="w-full h-full">
                </div>
            </div>
        </div>

        <div
            id="settings-sidebar"
            class="w-80 bg-[#111] border-l border-gray-800 flex flex-col transform translate-x-full transition-transform duration-300 ease-in-out absolute right-0 top-0 h-full z-10 shadow-2xl">

            <div class="p-4 border-b border-gray-800 flex justify-between items-center bg-[#1a1a1a]">

                <h2 class="text-lg font-bold text-white flex items-center gap-2">
                    <i data-lucide="settings" class="text-marvelGold"></i>
                    Settings
                </h2>

                <button
                    onclick="toggleSettings()"
                    class="text-gray-400 hover:text-white">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <div class="p-4 flex-1 overflow-y-auto space-y-6">

                <div class="bg-marvelBlue/20 p-4 rounded-lg border border-marvelBlue/50 text-center">

                    <!-- yt.jpeg logo -->
                    <img
                        src="./yt.jpeg"
                        alt="Account"
                        class="w-16 h-16 mx-auto rounded-full bg-gray-800 mb-2 object-cover">

                    <h3 class="font-bold">
                        New Account
                    </h3>

                    <p class="text-xs text-gray-400 mb-3">
                        Sign in to sync your data across devices.
                    </p>

                    <button
                        class="bg-marvelRed hover:bg-red-700 text-white text-sm py-1.5 px-4 rounded-full w-full transition"
                        onclick="window.jsMiniSignIn && window.jsMiniSignIn()">
                        Sign In / Create Account
                    </button>
                </div>

                <div class="space-y-1">

                    <a
                        href="#"
                        class="flex items-center gap-3 p-2 hover:bg-gray-800 rounded text-gray-300 hover:text-white transition">
                        <i data-lucide="palette" class="w-4 h-4 text-gray-400"></i>
                        Appearance (Marvel Theme)
                    </a>

                    <a
                        href="#"
                        class="flex items-center gap-3 p-2 hover:bg-gray-800 rounded text-gray-300 hover:text-white transition">
                        <i data-lucide="shield-check" class="w-4 h-4 text-gray-400"></i>
                        Privacy & Security
                    </a>

                    <a
                        href="#"
                        class="flex items-center gap-3 p-2 hover:bg-gray-800 rounded text-gray-300 hover:text-white transition">
                        <i data-lucide="upload-cloud" class="w-4 h-4 text-gray-400"></i>
                        Publish Website

                        <span class="bg-marvelGold text-black text-[10px] px-1.5 py-0.5 rounded font-bold ml-auto">

                document.getElementById(
                    'jsminiProjectName'
                ).value =
                    data.name ||
                    'Untitled Project';

                document.getElementById(
                    'jsminiDescription'
                ).value =
                    data.jsMiniDescription ||
                    '';

                document.getElementById(
                    'jsminiDomain'
                ).value =
                    data.jsMiniDomain ||
                    normalizeDomain(
                        data.name ||
                        'my-site'
                    );

                document.getElementById(
                    'jsminiCategory'
                ).value =
                    data.jsMiniCategory ||
                    'Other';

                document.getElementById(
                    'jsminiVisibility'
                ).value =
                    data.jsMiniVisibility ||
                    'public';

                wrapDeployModal(true);

                window.__jsMiniDeployProject = {
                    id,
                    data
                };
            };

        function wrapDeployModal(show) {

            const m =
                document.getElementById(
                    'jsmini-deploy-modal'
                );

            if (m) {
                m.classList.toggle(
                    'hidden',
                    !show
                );
            }
        }

        function closeJSMiniDeploy() {
            wrapDeployModal(false);
        }

        async function submitJSMiniDeploy() {

            const state =
                window.__jsMiniDeployProject;

            if (!state || !jsMiniUser) return;

            const name =
                document.getElementById(
                    'jsminiProjectName'
                ).value.trim() ||
                'Untitled Project';

            const description =
                document.getElementById(
                    'jsminiDescription'
                ).value.trim();

            const domain =
                normalizeDomain(
                    document.getElementById(
                        'jsminiDomain'
                    ).value
                );

            const category =
                document.getElementById(
                    'jsminiCategory'
                ).value;

            const visibility =
                document.getElementById(
                    'jsminiVisibility'
                ).value;

            const status =
                document.getElementById(
                    'jsminiDeployStatus'
                );

            const btn =
                document.getElementById(
                    'jsminiDeployBtn'
                );

            if (!domainValid(domain)) {

                status.className =
                    'jsmini-status jsmini-error';

                status.textContent =
                    'Use 1–50 lowercase letters, numbers and hyphens.';

                return;
            }

            btn.disabled = true;

            status.className =
                'jsmini-status jsmini-loading';

            status.textContent =
                'Checking virtual domain...';

            try {

                const q =
                    query(
                        collection(
                            jsMiniDb,
                            'public_projects'
                        ),
                        where(
                            'jsMiniPublished',
                            '==',
                            true
                        )
                    );

                const taken =
                    await getDocs(q);

                let conflict = false;

                taken.forEach(d => {

                    const x = d.data();

                    if (
                        x.id !== state.id &&
                        x.jsMiniPublished === true &&
                        normalizeDomain(
                            x.virtualDomain || ''
                        ) === domain
                    ) {
                        conflict = true;
                    }
                });

                if (conflict) {

                    status.className =
                        'jsmini-status jsmini-error';

                    status.textContent =
                        'That virtual domain is already taken.';

                    btn.disabled = false;

                    return;
                }

                status.textContent =
                    'Preparing your website...';

                const htmlBundle =
                    buildJSMiniStandalone(
                        state.data.files || {}
                    );

                const site = {

                    id: state.id,

                    ownerUid:
                        jsMiniUser.uid,

                    ownerName:
                        jsMiniUser.displayName || '',

                    ownerPhoto:
                        jsMiniUser.photoURL || '',

                    name,

                    description,

                    virtualDomain:
                        domain,

                    category,

                    visibility,

                    status:
                        'published',

                    jsMiniPublished:
                        true,

                    htmlBundle,

                    publishedAt:
                        serverTimestamp(),

                    updatedAt:
                        serverTimestamp()
                };

                await setDoc(
                    doc(
                        jsMiniDb,
                        'public_projects',
                        state.id
                    ),
                    site,
                    { merge: true }
                );

                await setDoc(
                    doc(
                        jsMiniDb,
                        'users',
                        jsMiniUser.uid,
                        'projects',
                        state.id
                    ),
                    {
                        name,
                        jsMiniDescription:
                            description,
                        jsMiniDomain:
                            domain,
                        jsMiniCategory:
                            category,
                        jsMiniVisibility:
                            visibility,
                        jsMiniDeployed:
                            true
                    },
                    { merge: true }
                );

                status.className =
                    'jsmini-status jsmini-success';

                status.textContent =
                    '✓ Deployed successfully.';

                setTimeout(
                    () => {

                        closeJSMiniDeploy();

                        loadJSMiniSite(
                            domain,
                            true
                        );
                    },
                    550
                );

            } catch (e) {

                console.error(e);

                status.className =
                    'jsmini-status jsmini-error';

                status.textContent =
                    'Deployment failed. Please try again.';

                btn.disabled = false;
            }
        }

        function buildJSMiniStandalone(files) {

            const keys =
                Object.keys(files)
                    .filter(
                        k => !k.endsWith('/')
                    );

            const htmlKey =
                keys.find(
                    k =>
                        k.toLowerCase() ===
                        'index.html'
                ) ||
                keys.find(
                    k =>
                        /\.html?$/i.test(k)
                );

            let html =
                htmlKey
                    ? String(files[htmlKey] || '')
                    : '';

            const css =
                keys
                    .filter(
                        k =>
                            /\.css$/i.test(k)
                    )
                    .map(
                        k =>
                            files[k] || ''
                    )
                    .join('\n');

            const js =
                keys
                    .filter(
                        k =>
                            /\.(js|mjs)$/i.test(k)
                    )
                    .map(
                        k =>
                            files[k] || ''
                    )
                    .join(';\n');

            return `
                <!DOCTYPE html>
                <html>
                <head>
                    <meta charset="UTF-8">
                    <meta
                        name="viewport"
                        content="width=device-width,initial-scale=1">
                    <style>
                        ${css}
                    </style>
                </head>

                <body>
                    ${html}

                    <script>
                        try {
                            ${js}
                        } catch(e) {
                            console.error(e)
                        }
                    <\/script>
                </body>
                </html>
            `;
        }

        async function loadCloudSites() {

            try {

                let snap;

                try {

                    snap =
                        await getDocs(
                            query(
                                collection(
                                    jsMiniDb,
                                    'public_projects'
                                ),
                                where(
                                    'jsMiniPublished',
                                    '==',
                                    true
                                )
                            )
                        );

                } catch (e) {

                    if (!jsMiniUser) {

                        try {

                            await signInAnonymously(
                                jsMiniAuth
                            );

                            snap =
                                await getDocs(
                                    query(
                                        collection(
                                            jsMiniDb,
                                            'public_projects'
                                        ),
                                        where(
                                            'jsMiniPublished',
                                            '==',
                                            true
                                        )
                                    )
                                );

                        } catch (e2) {

                            throw e2;
                        }

                    } else {

                        throw e;
                    }
                }

                jsMiniCloudSites = [];

                snap.forEach(d => {

                    jsMiniCloudSites.push({
                        id: d.id,
                        ...d.data()
                    });
                });

                renderCloudSites();

            } catch (e) {

                console.error(
                    'JS Mini sites load failed:',
                    e
                );
            }
        }

        function allSites() {

            return jsMiniCloudSites
                .filter(
                    s =>
                        s.visibility !==
                        'unlisted'
                )
                .map(
                    s => ({
                        url:
                            (s.virtualDomain || '') +
                            '.jsmini',

                        title:
                            s.name ||
                            'Untitled Website',

                        snippet:
                            s.description ||
                            'Published on JS mini.Browser',

                        theme:
                            'dark',

                        cloud:
                            true,

                        site:
                            s
                    })
                );
        }

        function renderCloudSites() {

            const el =
                document.getElementById(
                    'jsmini-cloud-sites'
                );

            if (!el) return;

            const sites =
                jsMiniCloudSites.filter(
                    s =>
                        s.visibility !==
                        'unlisted'
                );

            if (!sites.length) {

                el.innerHTML =
                    '<div class="text-xs text-gray-500">No public JS mini websites yet. Be the first to deploy one.</div>';

                return;
            }

            el.innerHTML =
                sites
                    .slice(0, 12)
                    .map(
                        s => `

                        <div
                            class="jsmini-site-card"
                            onclick="loadSite('${escapeHTML(
                                (s.virtualDomain || '') +
                                '.jsmini'
                            )}')">

                            <h3>
                                ${escapeHTML(
                                    s.name ||
                                    'Untitled'
                                )}
                            </h3>

                            <p>
                                ${escapeHTML(
                                    s.description ||
                                    'No description'
                                )}
                            </p>

                            <div class="domain">
                                ${escapeHTML(
                                    (s.virtualDomain || '') +
                                    '.jsmini'
                                )}
                                ·
                                ${escapeHTML(
                                    s.category ||
                                    'Other'
                                )}
                            </div>

                        </div>
                    `
                    )
                    .join('');
        }

        window.executeJSMiniSearch =
            async function (q) {

                const queryText =
                    String(q || '')
                        .trim()
                        .toLowerCase();

                if (!queryText) {

                    goHome();

                    return;
                }

                await loadCloudSites();

                const local =
                    mockDatabase.map(
                        x => ({
                            ...x,
                            cloud: false
                        })
                    );

                const sites =
                    [
                        ...allSites(),
                        ...local
                    ]
                    .filter(
                        s =>
                            `${s.title} ${s.snippet} ${s.url}`
                                .toLowerCase()
                                .includes(queryText)
                    );

                document.getElementById(
                    'search-query-text'
                ).textContent = q;

                const c =
                    document.getElementById(
                        'results-container'
                    );

                if (!sites.length) {

                    c.innerHTML = `
                        <div class="text-center py-20">

                            <i
                                data-lucide="search-x"
                                class="w-16 h-16 text-gray-600 mx-auto mb-4">
                            </i>

                            <h3 class="text-xl text-gray-300 font-medium">
                                No JS mini websites found
                            </h3>

                            <p class="text-gray-500 mt-2">
                                Only websites deployed inside JS mini.Browser are searchable here.
                            </p>

                        </div>
                    `;

                } else {

                    c.innerHTML =
                        sites
                            .map(
                                s => `

                                <div
                                    class="group cursor-pointer bg-[#151515] p-5 rounded-xl border border-gray-800 hover:border-marvelRed transition-colors shadow-lg"
                                    onclick="loadSite('${escapeHTML(
                                        s.url
                                    )}')">

                                    <div class="flex items-start gap-4">

                                        <div class="mt-1 bg-gray-800 p-2 rounded text-marvelGold group-hover:bg-marvelRed group-hover:text-white transition">

                                            <i
                                                data-lucide="globe"
                                                class="w-5 h-5">
                                            </i>

                                        </div>

                                        <div>

                                            <div class="text-sm text-gray-400 mb-1">

                                                js://${escapeHTML(
                                                    s.url
                                                )}

                                                <span class="bg-gray-800 text-[10px] px-1.5 py-0.5 rounded text-gray-400">

                                                    ${s.cloud
                                                        ? 'Published'
                                                        : 'Demo'}

                                                </span>

                                            </div>

                                            <h3 class="text-xl text-blue-400 group-hover:underline font-medium mb-2">

                                                ${escapeHTML(
                                                    s.title
                                                )}

                                            </h3>

                                            <p class="text-gray-300 text-sm leading-relaxed">

                                                ${escapeHTML(
                                                    s.snippet
                                                )}

                                            </p>

                                        </div>
                                    </div>
                                </div>
                            `
                            )
                            .join('');
                }

                lucide.createIcons();

                switchView(
                    'view-search-results'
                );
            };

        window.loadJSMiniSite =
            async function (
                raw,
                fromHistory = false
            ) {

                let domain =
                    normalizeDomain(raw);

                if (!domain) return;

                const full =
                    domain +
                    '.jsmini';

                document.getElementById(
                    'address-bar'
                ).value = full;

                await loadCloudSites();

                const site =
                    jsMiniCloudSites.find(
                        s =>
                            normalizeDomain(
                                s.virtualDomain || ''
                            ) === domain
                    );

                if (site) {

                    const c =
                        document.getElementById(
                            'website-content'
                        );

                    c.innerHTML = `

                        <div class="jsmini-sitebar">

                            <div>

                                <strong>
                                    ${escapeHTML(
                                        site.name ||
                                        domain
                                    )}
                                </strong>

                                <br>

                                <span>
                                    ${escapeHTML(
                                        full
                                    )}
                                    ·
                                    ${escapeHTML(
                                        site.description ||
                                        ''
                                    )}
                                </span>

                            </div>

                            <span>
                                ${escapeHTML(
                                    site.category ||
                                    'Other'
                                )}
                            </span>

                        </div>

                        <iframe
                            class="jsmini-open-frame"
                            sandbox="allow-scripts allow-forms allow-modals allow-popups"
                            title="${escapeHTML(
                                site.name ||
                                domain
                            )}">
                        </iframe>
                    `;

                    const frame =
                        c.querySelector(
                            'iframe'
                        );

                    frame.srcdoc =
                        site.htmlBundle ||
                        '<h1>Empty website</h1>';

                    switchView(
                        'view-website'
                    );

                    if (!fromHistory) {

                        jsMiniHistory =
                            jsMiniHistory.slice(
                                0,
                                jsMiniHistoryIndex + 1
                            );

                        jsMiniHistory.push(
                            domain
                        );

                        jsMiniHistoryIndex =
                            jsMiniHistory.length - 1;
                    }

                    return;
                }

                const demo =
                    mockDatabase.find(
                        x =>
                            normalizeDomain(
                                x.url
                            ) === domain
                    );

                if (demo) {

                    if (
                        window.originalLoadSiteForJSMini
                    ) {

                        window.originalLoadSiteForJSMini(
                            raw
                        );
                    }

                    return;
                }

                loadSite(raw);
            };

        window.loadSite =
            window.loadJSMiniSite;

        window.executeSearch =
            window.executeJSMiniSearch;

        window.goJSMiniBack =
            function () {

                if (
                    jsMiniHistoryIndex > 0
                ) {

                    jsMiniHistoryIndex--;

                    loadJSMiniSite(
                        jsMiniHistory[
                            jsMiniHistoryIndex
                        ],
                        true
                    );

                } else {

                    goHome();
                }
            };

        window.goJSMiniForward =
            function () {

                if (
                    jsMiniHistoryIndex <
                    jsMiniHistory.length - 1
                ) {

                    jsMiniHistoryIndex++;

                    loadJSMiniSite(
                        jsMiniHistory[
                            jsMiniHistoryIndex
                        ],
                        true
                    );
                }
            };

        window.handleJSMiniDeployFromURL =
            async function () {

                const p =
                    new URLSearchParams(
                        location.search
                    );

                const id =
                    p.get('deploy');

                const site =
                    p.get('site');

                if (id) {

                    await window.openJSMiniDeploy(
                        id
                    );

                    return;
                }

                if (site) {

                    await loadJSMiniSite(
                        site,
                        true
                    );

                    return;
                }

                goHome();
            };

        function addCloudSection() {

            const home =
                document.getElementById(
                    'view-home'
                );

            if (
                !home ||
                document.getElementById(
                    'jsmini-cloud-sites'
                )
            ) {
                return;
            }

            const sec =
                document.createElement(
                    'div'
                );

            sec.className =
                'jsmini-sites-section';

            sec.innerHTML = `
                <div class="jsmini-sites-title">
                    Public JS mini websites
                </div>

                <div
                    id="jsmini-cloud-sites"
                    class="jsmini-sites-grid">
                </div>
            `;

            home.appendChild(sec);
        }

        window.addEventListener(
            'DOMContentLoaded',
            () => {

                ensureJSMiniUI();

                addCloudSection();

                loadCloudSites();

                setTimeout(
                    () =>
                        window.handleJSMiniDeployFromURL(),
                    100
                );
            }
        );

    </script>

    <script>

        /*
         * Preserve original demo database
         * while routing real JS mini sites through Firebase.
         */

        window.originalLoadSiteForJSMini =
            window.loadSite;

    </script>

</body>
</html>
