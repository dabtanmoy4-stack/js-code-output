<!DOCTYPE html>
<html lang="en">
<head><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Miod — Build with Miod</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#050507;
  --panel:#0d0d11;
  --panel2:#121116;
  --gold:#f2b83f;
  --gold2:#ffe39a;
  --gold3:#9d6416;
  --pink:#ff20cf;
  --violet:#7b31ff;
  --blue:#176cff;
  --cyan:#14d9ff;
  --text:#f8f5ed;
  --muted:#9b968d;
  --line:rgba(242,184,63,.18);
}
html,body{
  width:100%;height:100%;
  overflow:hidden;
  font-family:Inter,Segoe UI,Arial,sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 10% 15%,rgba(255,0,210,.08),transparent 28%),
    radial-gradient(circle at 90% 15%,rgba(0,105,255,.09),transparent 30%),
    radial-gradient(circle at 50% 110%,rgba(242,184,63,.08),transparent 35%),
    var(--bg);
}
body:before{
  content:"";
  position:fixed;inset:-45%;
  pointer-events:none;z-index:0;
  background:conic-gradient(from 0deg,
    transparent 0 20%,
    rgba(242,184,63,.045) 24%,
    transparent 29% 53%,
    rgba(255,213,120,.035) 57%,
    transparent 63%);
  animation:goldOrbit 20s linear infinite;
}
body:after{
  content:"";
  position:fixed;inset:0;
  pointer-events:none;z-index:0;
  background:
    radial-gradient(circle at 50% 50%,transparent 35%,rgba(242,184,63,.035) 55%,transparent 70%);
  animation:goldPulse 5s ease-in-out infinite;
}
@keyframes goldOrbit{to{transform:rotate(360deg)}}
@keyframes goldPulse{50%{opacity:.65;transform:scale(1.05)}}

button,input,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}


.miod-mark{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:23px;height:23px;
  margin-right:3px;
  border-radius:7px;
  font-size:15px;
  font-weight:950;
  line-height:1;
  color:#fff;
  background:linear-gradient(135deg,#f2b83f 0%,#ff2acb 48%,#6d35ff 76%,#18cfff 100%);
  box-shadow:0 0 12px rgba(255,42,203,.22),0 0 10px rgba(242,184,63,.22);
  text-shadow:0 1px 4px rgba(0,0,0,.45);
  vertical-align:middle;
}
.inline-mark{
  width:22px;height:22px;
  font-size:14px;
}

/* TOP BAR — no fullscreen button here */
.topbar{
  height:68px;
  position:relative;
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
  background:linear-gradient(90deg,rgba(6,6,9,.98),rgba(19,15,8,.96),rgba(7,8,12,.98));
  border-bottom:1px solid var(--line);
  box-shadow:0 8px 35px rgba(0,0,0,.32),0 1px 0 rgba(255,220,145,.04);
}
.brand{display:flex;align-items:center;gap:10px}
.brand img{
  width:42px;height:42px;object-fit:contain;border-radius:11px;
  filter:drop-shadow(0 0 8px rgba(242,184,63,.55)) drop-shadow(0 0 9px rgba(255,0,200,.22));
}
.brand-title{font-size:17px;font-weight:900;letter-spacing:.2px}
.brand-sub{font-size:9px;color:#88837a;letter-spacing:1.35px;text-transform:uppercase;margin-top:4px}
.mode-pill{
  padding:7px 11px;border-radius:999px;
  border:1px solid rgba(242,184,63,.18);
  background:rgba(242,184,63,.035);
  color:#cfc8b9;font-size:10px;letter-spacing:.7px;
}

/* GOLD SHINE */
.gold-shine{position:relative;overflow:hidden}
.gold-shine:after{
  content:"";position:absolute;top:-40%;left:-90%;
  width:42%;height:180%;
  background:linear-gradient(90deg,transparent,rgba(255,238,175,.55),transparent);
  transform:skewX(-20deg);
  animation:shine 4.7s ease-in-out infinite;
  pointer-events:none;
}
@keyframes shine{0%,55%{left:-90%}100%{left:145%}}

/* START */
.start-screen{
  position:absolute;inset:68px 0 0;z-index:5;
  display:flex;align-items:center;justify-content:center;
  padding:26px;overflow:auto;
}
.start-content{width:min(900px,100%);text-align:center}
.logo-large{
  width:88px;height:88px;object-fit:contain;border-radius:23px;
  margin:0 auto 23px;
  filter:drop-shadow(0 0 12px rgba(242,184,63,.68)) drop-shadow(0 0 18px rgba(255,0,200,.28));
  animation:logoFloat 4s ease-in-out infinite;
}
@keyframes logoFloat{50%{transform:translateY(-7px) scale(1.02)}}
.start-title{
  font-size:clamp(38px,6vw,70px);
  line-height:1;font-weight:950;letter-spacing:-2.4px;
  background:linear-gradient(100deg,#fff,#ffd978,#fff0c5,#ff35d0,#8a6bff,#fff);
  background-size:320% auto;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:titleMove 7s linear infinite;
}
@keyframes titleMove{to{background-position:320% center}}
.start-description{
  max-width:680px;margin:17px auto 28px;
  color:#aaa59b;line-height:1.7;font-size:14px;
}
.ai-prompt{
  width:100%;min-height:145px;max-height:300px;padding:20px 21px;resize:none;outline:none;
  color:#f6f2e9;background:linear-gradient(145deg,rgba(255,255,255,.055),rgba(242,184,63,.018));
  border:1px solid rgba(242,184,63,.23);border-radius:19px;
  box-shadow:0 25px 80px rgba(0,0,0,.44);
  transition:.3s;
}
.ai-prompt::placeholder{color:#76736b}
.ai-prompt:focus{
  border-color:rgba(255,222,143,.75);
  box-shadow:0 0 0 4px rgba(242,184,63,.055),0 0 35px rgba(242,184,63,.1),0 25px 80px rgba(0,0,0,.44);
}
.start-bottom{
  margin-top:13px;display:flex;align-items:center;justify-content:space-between;gap:12px
}
.prompt-tip{font-size:11px;color:#77736b;text-align:left}
.build-btn{
  position:relative;overflow:hidden;
  min-width:190px;height:52px;padding:0 24px;
  border-radius:14px;border:1px solid rgba(255,234,175,.55);
  color:#171208;font-weight:900;font-size:14px;
  background:linear-gradient(105deg,#b87515,#ffe29a 42%,#dfa02d 70%,#945a10);
  box-shadow:0 0 25px rgba(242,184,63,.18),inset 0 1px 0 rgba(255,255,255,.65);
  transition:.3s;
}
.build-btn:hover{transform:translateY(-2px);box-shadow:0 0 38px rgba(242,184,63,.3),0 12px 35px rgba(0,0,0,.3)}
.build-btn:active{transform:scale(.97)}

/* WORKSPACE */
.ai-workspace{
  position:absolute;inset:68px 0 0;z-index:5;
  padding:11px;
  display:grid;
  grid-template-columns:minmax(240px,.85fr) minmax(350px,1.35fr) minmax(350px,1.45fr);
  gap:11px;
}

/* Individual panel fullscreen */
.ai-workspace.panel-focus{
  display:block;
  padding:10px;
}
.ai-workspace.panel-focus .panel{display:none}
.ai-workspace.panel-focus .panel.focused-panel{
  display:flex;width:100%;height:100%;min-height:0;
}

/* Native browser fullscreen-like app mode */
body.native-fullscreen .topbar{display:none}
body.native-fullscreen .ai-workspace{inset:0}

/* PANELS */
.panel{
  min-width:0;min-height:0;display:flex;flex-direction:column;
  background:linear-gradient(145deg,rgba(18,17,20,.985),rgba(7,8,11,.985));
  border:1px solid rgba(242,184,63,.15);border-radius:16px;overflow:hidden;
  box-shadow:0 18px 55px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,220,145,.035);
}
.panel:hover{border-color:rgba(242,184,63,.2)}
.panel-header{
  height:56px;flex-shrink:0;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 13px;
  border-bottom:1px solid rgba(242,184,63,.1);
  background:linear-gradient(90deg,rgba(255,255,255,.035),rgba(242,184,63,.018),rgba(255,255,255,.01));
}
.panel-title{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:850}
.panel-title img{width:27px;height:27px;object-fit:contain;border-radius:7px;filter:drop-shadow(0 0 5px rgba(242,184,63,.35))}
.panel-dot{width:7px;height:7px;border-radius:50%;background:#e9b43d;box-shadow:0 0 9px #e9b43d}
.panel-tools{display:flex;align-items:center;gap:5px}
.small-btn{
  height:30px;padding:0 9px;border-radius:8px;
  color:#d9d3c7;background:linear-gradient(145deg,rgba(255,255,255,.05),rgba(242,184,63,.025));
  border:1px solid rgba(242,184,63,.18);font-size:10px;transition:.22s;
}
.small-btn:hover{border-color:rgba(255,220,140,.7);box-shadow:0 0 18px rgba(242,184,63,.11)}
.panel-full-btn{
  min-width:30px;padding:0 8px;
  color:#ffd978;
}

/* CHAT */
.chat-messages{flex:1;min-height:0;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:12px}
.chat-messages::-webkit-scrollbar,.code-area::-webkit-scrollbar{width:6px}
.chat-messages::-webkit-scrollbar-thumb,.code-area::-webkit-scrollbar-thumb{background:#3b3020;border-radius:20px}
.message{max-width:92%;padding:11px 12px;border-radius:12px;font-size:11.5px;line-height:1.6}
.message.ai{
  align-self:flex-start;
  background:linear-gradient(135deg,rgba(242,184,63,.08),rgba(255,0,200,.045),rgba(60,50,255,.045));
  border:1px solid rgba(242,184,63,.11);color:#d8d5cd
}
.message.user{
  align-self:flex-end;
  background:linear-gradient(135deg,rgba(255,0,190,.14),rgba(80,42,255,.13));
  border:1px solid rgba(255,30,200,.18);color:#fff
}
.message strong{display:block;margin-bottom:4px;color:#fff}
.chat-input-area{padding:10px;border-top:1px solid rgba(242,184,63,.09);display:flex;gap:6px}
.chat-input{
  min-width:0;flex:1;min-height:42px;max-height:130px;padding:11px 11px;
  border-radius:10px;outline:none;color:#fff;background:#090a0d;
  border:1px solid rgba(242,184,63,.15);resize:none;overflow-y:auto;
  line-height:1.35
}
.chat-input:focus{border-color:rgba(255,220,140,.6)}
.send-btn{
  width:43px;height:42px;flex-shrink:0;border-radius:10px;
  color:#171208;border:1px solid rgba(255,230,150,.35);
  background:linear-gradient(135deg,#f8cc6b,#b97819);
  box-shadow:0 0 15px rgba(242,184,63,.12)
}

/* CODE */
.code-wrapper{flex:1;min-height:0;position:relative}
.code-area{
  width:100%;height:100%;padding:16px;resize:none;outline:none;border:0;
  color:#e4e6ef;background:radial-gradient(circle at 70% 10%,rgba(242,184,63,.04),transparent 30%),#08090d;
  font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
  font-size:12px;line-height:1.7;tab-size:2
}
.code-footer,.output-toolbar{
  height:35px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;
  padding:0 11px;color:#716d65;font-size:10px;border-top:1px solid rgba(242,184,63,.08)
}

/* OUTPUT */
.preview-wrapper{flex:1;min-height:0;padding:9px;background:radial-gradient(circle at 50% 0%,rgba(242,184,63,.05),transparent 35%),#08090d}
.preview-frame{width:100%;height:100%;border:0;border-radius:10px;background:#fff}
.live-status{display:flex;align-items:center;gap:6px}
.live-dot{width:7px;height:7px;border-radius:50%;background:#e9b43d;box-shadow:0 0 8px #e9b43d}

/* TYPING */
.typing{display:flex;gap:5px;align-items:center}.typing span{width:5px;height:5px;border-radius:50%;background:#f5b942;animation:typing 1.1s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes typing{0%,70%,100%{transform:translateY(0);opacity:.4}35%{transform:translateY(-5px);opacity:1}}

.toast{
  position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:100;
  padding:10px 15px;border-radius:10px;background:linear-gradient(105deg,#b97818,#f4c75e,#9d6417);
  color:#171208;font-size:11px;font-weight:900;box-shadow:0 10px 35px rgba(0,0,0,.4),0 0 25px rgba(242,184,63,.16);transition:.3s
}
.toast.show{transform:translate(-50%,0);opacity:1}

/* TABLET */
@media(max-width:1080px){
  .ai-workspace{grid-template-columns:240px minmax(300px,1fr)}
  .output-panel{grid-column:1/-1;min-height:350px}
}

/* PHONE */
@media(max-width:720px){
  html,body{overflow:hidden}
  .topbar{height:60px;padding:0 11px}
  .brand img{width:35px;height:35px}.brand-title{font-size:14px}.brand-sub{display:none}
  .mode-pill{font-size:9px;padding:6px 8px}
  .start-screen{inset:60px 0 0;padding:18px 13px 25px;align-items:flex-start;overflow:auto}
  .start-content{margin-top:5vh}.logo-large{width:72px;height:72px;margin-bottom:18px}
  .start-title{font-size:40px;letter-spacing:-1.7px}
  .start-description{font-size:12.5px;line-height:1.65;margin:13px auto 20px}
  .ai-prompt{min-height:145px;max-height:300px;padding:16px;border-radius:15px;font-size:13px}
  .start-bottom{flex-direction:column;align-items:stretch}.prompt-tip{text-align:center;order:2}
  .build-btn{width:100%;height:50px}

  .ai-workspace{
    position:absolute;inset:60px 0 0;
    display:flex;flex-direction:column;
    overflow-y:auto;overflow-x:hidden;
    padding:8px;gap:8px;
    -webkit-overflow-scrolling:touch
  }
  .panel{flex:none;width:100%;height:430px;min-height:430px}
  .chat-panel{height:400px;min-height:400px}
  .code-panel{height:510px;min-height:510px}
  .output-panel{height:510px;min-height:510px}

  /* mobile panel fullscreen */
  .ai-workspace.panel-focus{
    position:fixed;inset:0;padding:0;z-index:50;
    background:#050507;overflow:hidden
  }
  .ai-workspace.panel-focus .panel.focused-panel{
    width:100%;height:100%;border-radius:0;border:0
  }
  .ai-workspace.panel-focus .panel-header{height:57px;padding:0 11px}
  .ai-workspace.panel-focus .chat-messages{padding:13px}
  .ai-workspace.panel-focus .code-area{font-size:12px;padding:13px}
  .ai-workspace.panel-focus .preview-wrapper{padding:7px}

  .panel-header{height:54px;padding:0 11px}
  .panel-title{font-size:12px}.small-btn{height:29px;padding:0 8px}
  .panel-full-btn{display:flex}
  .message{font-size:11.5px;max-width:94%}
  .chat-input{min-height:43px;height:43px;font-size:12px}
  .send-btn{height:43px;width:43px}
}

/* VERY SMALL PHONES */
@media(max-width:390px){
  .start-title{font-size:35px}
  .start-description{font-size:12px}
  .ai-prompt{min-height:135px;max-height:300px}
  .panel{height:410px;min-height:410px}
  .code-panel,.output-panel{height:480px;min-height:480px}
  .panel-tools{gap:3px}
  .small-btn{padding:0 6px;font-size:9px}
}
</style>
</head>

let geminiInteractionId = null;

async function callMiodAI({prompt, currentCode="", previousInteractionId=null, mode="build"}){
  const response = await fetch("/api/gemini",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      prompt,
      currentCode,
      previousInteractionId,
      mode
    })
  });

  let data = null;
  try{ data = await response.json(); }catch(e){}

  if(!response.ok){
    throw new Error(data?.error || `AI request failed (${response.status})`);
  }

  if(data?.interactionId) geminiInteractionId = data.interactionId;
  return data;
}

function extractGeneratedCode(text){
  if(!text) return "";
  const fenced = text.match(/```(?:html|HTML)?\s*([\s\S]*?)```/);
  if(fenced) return fenced[1].trim();

  const start = text.search(/<!doctype\s+html|<html[\s>]/i);
  if(start >= 0){
    const candidate = text.slice(start).trim();
    const end = candidate.search(/<\/html>\s*$/i);
    return end >= 0 ? candidate.slice(0,end + 7).trim() : candidate;
  }

  return "";
}

function escapeHTML(v){
  return String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}

function addMessage(type,text){
  const el=document.createElement("div");
  el.className="message "+type;
  el.innerHTML=type==="ai"?`<strong><span class="miod-mark">M</span> Miod</strong>${text}`:`<strong>You</strong>${escapeHTML(text)}`;
  chatMessages.appendChild(el);
  chatMessages.scrollTop=chatMessages.scrollHeight;
}

async function typeCode(code){
  codeArea.value="";
  codeStatus.textContent="Miod is writing code…";
  for(let i=0;i<code.length;i+=5){
    codeArea.value=code.slice(0,i);
    if(i%150===0) codeArea.scrollTop=codeArea.scrollHeight;
    await new Promise(r=>setTimeout(r,1));
  }
  codeArea.value=code;
  codeStatus.textContent="Generated";
}

function runPreview(){
  previewFrame.srcdoc=codeArea.value;
  lastAutoRunCode=codeArea.value;
  codeStatus.textContent="Live";
}

async function buildWithMiod(){
  const prompt=mainPrompt.value.trim();
  if(!prompt){
    showToast("Describe what you want to build first.");
    mainPrompt.focus();
    return;
  }

  buildBtn.disabled=true;
  buildBtn.textContent="Miod is building…";
  startScreen.classList.add("hidden");
  aiWorkspace.classList.remove("hidden");

  chatMessages.innerHTML="";
  geminiInteractionId=null;
  addMessage("user",prompt);

  const typing=document.createElement("div");
  typing.className="message ai";
  typing.innerHTML=`<strong><span class="miod-mark">M</span> Miod</strong><div class="typing"><span></span><span></span><span></span></div>`;
  chatMessages.appendChild(typing);
  chatMessages.scrollTop=chatMessages.scrollHeight;

  try{
    codeStatus.textContent="Miod is generating…";

    const result=await callMiodAI({
      prompt,
      mode:"build"
    });

    typing.remove();

    const generatedCode=extractGeneratedCode(result.text);
    if(!generatedCode){
      throw new Error("Miod returned an unexpected response. Please try again.");
    }

    addMessage("ai","Your website has been generated. You can edit the code or ask me for changes in Chat.");
    await typeCode(generatedCode);
    runPreview();
  }catch(error){
    typing.remove();
    addMessage("ai",`I couldn't connect to the AI server right now. ${escapeHTML(error.message)}`);
    codeStatus.textContent="AI connection error";
    showToast("Gemini connection failed");
  }finally{
    buildBtn.disabled=false;
    buildBtn.textContent="✨ Build with Miod";
  }
}

async function sendChat(){
  const text=chatInput.value.trim();
  if(!text)return;

  addMessage("user",text);
  chatInput.value="";
  chatInput.style.height="42px";

  const typing=document.createElement("div");
  typing.className="message ai";
  typing.innerHTML=`<strong><span class="miod-mark">M</span> Miod</strong><div class="typing"><span></span><span></span><span></span></div>`;
  chatMessages.appendChild(typing);
  chatMessages.scrollTop=chatMessages.scrollHeight;

  try{
    codeStatus.textContent="Miod is updating…";

    const result=await callMiodAI({
      prompt:text,
      currentCode:codeArea.value,
      previousInteractionId:geminiInteractionId,
      mode:"edit"
    });

    typing.remove();

    const generatedCode=extractGeneratedCode(result.text);

    if(generatedCode){
      await typeCode(generatedCode);
      runPreview();
      addMessage("ai","Done — I updated the code and refreshed the live preview.");
    }else{
      addMessage("ai",escapeHTML(result.text || "I couldn't produce an updated code response."));
      codeStatus.textContent="Ready";
    }
  }catch(error){
    typing.remove();
    addMessage("ai",`I couldn't connect to the AI server right now. ${escapeHTML(error.message)}`);
    codeStatus.textContent="AI connection error";
    showToast("Gemini connection failed");
  }
}

/* Individual panel fullscreen */
document.querySelectorAll("[data-full]").forEach(btn=>{
  btn.addEventListener("click",async()=>{
    const type=btn.dataset.full;
    const target=document.querySelector(`.panel[data-panel="${type}"]`);
    const already=aiWorkspace.classList.contains("panel-focus") &&
                  target.classList.contains("focused-panel");

    if(already){
      exitPanelFocus();
      return;
    }

    document.querySelectorAll(".panel").forEach(p=>p.classList.remove("focused-panel"));
    target.classList.add("focused-panel");
    aiWorkspace.classList.add("panel-focus");

    btn.textContent="⤢";

    try{
      if(document.documentElement.requestFullscreen){
        await document.documentElement.requestFullscreen();
        document.body.classList.add("native-fullscreen");
      }
    }catch(e){}
  });
});

function exitPanelFocus(){
  document.querySelectorAll(".panel").forEach(p=>p.classList.remove("focused-panel"));
  aiWorkspace.classList.remove("panel-focus");
  document.querySelectorAll("[data-full]").forEach(b=>b.textContent="⛶");

  if(document.fullscreenElement){
    document.exitFullscreen().catch(()=>{});
  }
  document.body.classList.remove("native-fullscreen");
}

document.addEventListener("fullscreenchange",()=>{
  if(!document.fullscreenElement && aiWorkspace.classList.contains("panel-focus")){
    document.querySelectorAll(".panel").forEach(p=>p.classList.remove("focused-panel"));
    aiWorkspace.classList.remove("panel-focus");
    document.querySelectorAll("[data-full]").forEach(b=>b.textContent="⛶");
    document.body.classList.remove("native-fullscreen");
  }
});

buildBtn.addEventListener("click",buildWithMiod);

/* First prompt behaves like a modern chat composer:
   Enter = send/build
   Shift + Enter = new line
   typing/paste = auto-grow */
function autoGrowPrompt(){
  mainPrompt.style.height="auto";
  const max=300;
  mainPrompt.style.height=Math.min(mainPrompt.scrollHeight,max)+"px";
}

mainPrompt.addEventListener("input",autoGrowPrompt);

mainPrompt.addEventListener("keydown",e=>{
  if(e.key==="Enter" && !e.shiftKey){
    e.preventDefault();
    buildWithMiod();
  }
});

mainPrompt.addEventListener("paste",()=>{
  requestAnimationFrame(autoGrowPrompt);
});
sendBtn.addEventListener("click",sendChat);
chatInput.addEventListener("input",()=>{
  chatInput.style.height="auto";
  chatInput.style.height=Math.min(chatInput.scrollHeight,130)+"px";
});

chatInput.addEventListener("keydown",e=>{
  if(e.key==="Enter" && !e.shiftKey){
    e.preventDefault();
    sendChat();
  }
});

chatInput.addEventListener("paste",()=>{
  requestAnimationFrame(()=>{
    chatInput.style.height="auto";
    chatInput.style.height=Math.min(chatInput.scrollHeight,130)+"px";
  });
});

let autoRunTimer;
let lastAutoRunCode = codeArea.value;

function scheduleAutoRun(){
  clearTimeout(autoRunTimer);
  codeStatus.textContent="Auto Run…";
  autoRunTimer=setTimeout(()=>{
    if(codeArea.value !== lastAutoRunCode){
      lastAutoRunCode=codeArea.value;
      runPreview();
      codeStatus.textContent="Auto Run";
    }
  },450);
}

codeArea.addEventListener("input",scheduleAutoRun);

document.getElementById("runCodeBtn").addEventListener("click",runPreview);
document.getElementById("refreshOutputBtn").addEventListener("click",runPreview);

document.getElementById("copyCodeBtn").addEventListener("click",async()=>{
  try{await navigator.clipboard.writeText(codeArea.value)}
  catch(e){codeArea.select();document.execCommand("copy")}
  showToast("Code copied");
});

document.getElementById("newChatBtn").addEventListener("click",()=>{
  geminiInteractionId=null;
  chatMessages.innerHTML="";
  codeStatus.textContent="Ready";
  addMessage("ai","New Miod session started. Tell me what you want to build.");
});

function showToast(text){
  toast.textContent=text;
  toast.classList.add("show");
  clearTimeout(window.__toast);
  window.__toast=setTimeout(()=>toast.classList.remove("show"),2100);
}
</script>
