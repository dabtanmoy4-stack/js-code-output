<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JS CODE OUTPUT Three.js Demo</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101827;color:white;font:13px system-ui}#tip{position:fixed;top:12px;left:12px;padding:10px 12px;background:#0b1220cc;border:1px solid #ffffff30;border-radius:10px;z-index:2}canvas{display:block}</style><script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script></head><body><div id="tip">Three.js · drag to rotate · scroll to zoom</div><script>
const scene=new THREE.Scene();scene.background=new THREE.Color(0x101827);const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,100);camera.position.set(4,3,6);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x334155,2));const light=new THREE.DirectionalLight(0xffffff,2.5);light.position.set(5,8,6);scene.add(light);const object=new THREE.Mesh(new THREE.TorusKnotGeometry(1,.28,140,18),new THREE.MeshStandardMaterial({color:0xf5bd45,metalness:.35,roughness:.25}));scene.add(object);const grid=new THREE.GridHelper(14,14,0x64748b,0x273449);grid.position.y=-1.8;scene.add(grid);let dragging=false,x=0,y=0,rx=.45,ry=.6,d=7;renderer.domElement.style.touchAction='none';renderer.domElement.addEventListener('pointerdown',e=>{dragging=true;x=e.clientX;y=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointerup',()=>dragging=false);renderer.domElement.addEventListener('pointermove',e=>{if(!dragging)return;ry-=(e.clientX-x)*.008;rx=Math.max(-1.35,Math.min(1.35,rx+(e.clientY-y)*.008));x=e.clientX;y=e.clientY});renderer.domElement.addEventListener('wheel',e=>{d=Math.max(2.5,Math.min(24,d+e.deltaY*.012));e.preventDefault()},{passive:false});function animate(t){requestAnimationFrame(animate);object.rotation.x=t*.00025;object.rotation.z=t*.00018;camera.position.set(Math.sin(ry)*Math.cos(rx)*d,Math.sin(rx)*d,Math.cos(ry)*Math.cos(rx)*d);camera.lookAt(0,0,0);renderer.render(scene,camera)}requestAnimationFrame(animate);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
