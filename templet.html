<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>JS Code Output – Template Gallery</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Georgia,"Times New Roman",serif}
body{background:#f7f2e8;color:#17130f;overflow-x:hidden}
body:before{content:"";position:fixed;inset:-20%;background:radial-gradient(circle at 15% 20%,rgba(198,155,65,.13),transparent 28%),radial-gradient(circle at 85% 15%,rgba(71,43,91,.08),transparent 25%);animation:drift 14s ease-in-out infinite alternate;pointer-events:none}
@keyframes drift{to{transform:translate3d(2%,-1%,0) scale(1.03)}}
header{position:sticky;top:0;z-index:20;background:rgba(247,242,232,.96);border-bottom:1px solid rgba(151,113,43,.25);backdrop-filter:blur(10px)}
.nav{max-width:1200px;margin:auto;min-height:76px;padding:12px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:#17130f}
.brand img{width:43px;height:43px;object-fit:cover;border-radius:10px;border:1px solid #c6a45a}
.brand strong{font-size:19px;letter-spacing:.04em}.brand span{display:block;font:11px Arial,sans-serif;color:#77654a;margin-top:2px}
.nav-actions{display:flex;gap:10px;align-items:center}
.btn{border:1px solid #b9954d;background:#17130f;color:#f9f3e7;border-radius:10px;padding:11px 16px;font:600 13px Arial,sans-serif;text-decoration:none;cursor:pointer;transition:.2s}
.btn:hover{transform:translateY(-1px);box-shadow:0 7px 20px rgba(60,39,12,.15)}
.btn.light{background:#fffaf1;color:#211a13}.btn.gold{background:linear-gradient(135deg,#b48a35,#e0bd67);color:#1b140a}
main{max-width:1200px;margin:auto;padding:55px 22px 80px}
.hero{text-align:center;max-width:800px;margin:0 auto 34px}
.badge{display:inline-block;padding:7px 13px;border:1px solid #c9aa63;border-radius:999px;color:#806326;background:#fff9ed;font:700 11px Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase}
h1{font-size:clamp(42px,7vw,76px);line-height:.96;margin:18px 0 15px;font-weight:500;letter-spacing:-.04em}
.hero p{font:15px/1.7 Arial,sans-serif;color:#6d6254;max-width:650px;margin:auto}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:35px 0 24px}
.search{flex:1 1 280px;min-width:220px;border:1px solid #d4c3a2;background:#fffaf2;border-radius:12px;padding:13px 15px;outline:none;font:14px Arial,sans-serif;color:#201a13}
.search:focus{border-color:#b38a3e;box-shadow:0 0 0 3px rgba(179,138,62,.1)}
.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{border:1px solid #d2c09e;background:#fffaf2;color:#695a45;border-radius:999px;padding:9px 13px;font:12px Arial,sans-serif;cursor:pointer}.chip.active{background:#1b1713;color:#fff8eb;border-color:#1b1713}
.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
.card{background:#fffaf2;border:1px solid #dcccae;border-radius:17px;overflow:hidden;box-shadow:0 12px 30px rgba(57,39,13,.06);transition:.25s}
.card:hover{transform:translateY(-4px);box-shadow:0 18px 38px rgba(57,39,13,.12)}
.preview{aspect-ratio:16/10;background:#211b17;position:relative;overflow:hidden}
.preview iframe{width:100%;height:100%;border:0;background:white}
.preview .placeholder{height:100%;display:grid;place-items:center;color:#d8b967;font:700 18px Georgia,serif;background:linear-gradient(135deg,#17130f,#35271a,#17130f)}
.cardbody{padding:18px}.meta{display:flex;justify-content:space-between;gap:8px;align-items:center}.category{font:10px Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#997533}.date{font:10px Arial,sans-serif;color:#998c79}
.card h3{font-size:23px;font-weight:500;margin:10px 0 8px}.desc{font:13px/1.6 Arial,sans-serif;color:#756b5e;min-height:42px}.cardactions{display:flex;gap:8px;margin-top:16px}.cardactions .btn{flex:1;text-align:center;padding:10px 9px;font-size:12px}
.empty{text-align:center;border:1px dashed #cdb98e;border-radius:17px;padding:55px 20px;background:rgba(255,250,242,.65);grid-column:1/-1}
.empty h2{font-size:28px;font-weight:500;margin:0 0 8px}.empty p{font:13px Arial,sans-serif;color:#776b5b}
footer{text-align:center;border-top:1px solid #decfb1;padding:25px;color:#897b67;font:11px Arial,sans-serif}
.toast{position:fixed;right:18px;bottom:18px;background:#17130f;color:#fff8ea;padding:13px 16px;border-radius:10px;font:13px Arial,sans-serif;opacity:0;transform:translateY(10px);pointer-events:none;transition:.25s;z-index:50}.toast.show{opacity:1;transform:none}
@media(max-width:850px){.gallery{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){.nav{padding:10px 14px}.brand strong{font-size:16px}.brand span{display:none}.nav .btn{padding:9px 11px}.nav-actions .light{display:none}main{padding:38px 14px 60px}h1{font-size:48px}.gallery{grid-template-columns:1fr}.toolbar{margin-top:27px}.search{flex-basis:100%}.card:hover{transform:none}}
</style>
</head>
<body>
<header><div class="nav">
<a class="brand" href="projects.html"><img src="logo.jpeg" alt="JS Code Output"><div><strong>JS Code Output</strong><span>Template Gallery</span></div></a>
<div class="nav-actions"><a class="btn light" href="projects.html">Back</a><a class="btn gold" href="add-templet.html">＋ Add Template</a></div>
</div></header>
<main>
<section class="hero">
<div class="badge">Template Gallery</div>
<h1>Build Something Beautiful.</h1>
<p>Explore ready-made templates, preview them live, and use the one that fits your next project.</p>
</section>
<div class="toolbar">
<input id="search" class="search" placeholder="Search templates..." autocomplete="off">
<div id="chips" class="chips"></div>
</div>
<section id="gallery" class="gallery"><div class="empty"><h2>Loading Templates…</h2><p>Connecting to the template gallery.</p></div></section>
</main>
<footer>JS CODE OUTPUT · Templates for creators</footer>
<div id="toast" class="toast"></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
import {getAuth,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
import {getDatabase,ref,onValue} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-database.js";

const firebaseConfig={
 apiKey:"AIzaSyDhFodV_ulVObuJCkBL-3UmTEnj1prWTuw",
 authDomain:"js-code-output.firebaseapp.com",
 databaseURL:"https://js-code-output-default-rtdb.firebaseio.com",
 projectId:"js-code-output",
 storageBucket:"js-code-output.firebasestorage.app",
 messagingSenderId:"600350018167",
 appId:"1:600350018167:web:3ceaa5a5e0d1050504d472",
 measurementId:"G-L47M0E9V96"
};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getDatabase(app);
const gallery=document.getElementById("gallery"),search=document.getElementById("search"),chips=document.getElementById("chips");
let all=[],category="All";

function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function render(){
 const q=search.value.trim().toLowerCase();
 const list=all.filter(t=>(category==="All"||String(t.category||"Other")===category)&&((t.name||"").toLowerCase().includes(q)||(t.description||"").toLowerCase().includes(q)));
 if(!list.length){gallery.innerHTML='<div class="empty"><h2>No Templates Found</h2><p>Try another search or category.</p></div>';return}
 gallery.innerHTML=list.map(t=>{
   const preview=t.previewUrl?`<iframe loading="lazy" sandbox="allow-scripts" src="${esc(t.previewUrl)}"></iframe>`:`<div class="placeholder">${esc(t.name||"Template")}</div>`;
   const use=t.templateUrl||t.liveUrl||"workspace.html";
   return `<article class="card"><div class="preview">${preview}</div><div class="cardbody"><div class="meta"><span class="category">${esc(t.category||"Other")}</span><span class="date">${t.createdAt?new Date(t.createdAt).toLocaleDateString():""}</span></div><h3>${esc(t.name||"Untitled Template")}</h3><div class="desc">${esc(t.description||"A beautiful template for your next project.")}</div><div class="cardactions"><a class="btn light" target="_blank" rel="noopener" href="${esc(t.liveUrl||t.previewUrl||use)}">Live Preview</a><a class="btn" href="${esc(use)}">Use Template</a></div></div></article>`;
 }).join("");
}
function renderChips(){
 const cats=["All",...new Set(all.map(x=>x.category||"Other"))];
 chips.innerHTML=cats.map(c=>`<button class="chip ${c===category?"active":""}" data-cat="${esc(c)}">${esc(c)}</button>`).join("");
 chips.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{category=b.dataset.cat;renderChips();render()});
}
onValue(ref(db,"templates"),snap=>{
 const data=snap.val()||{};
 all=Object.entries(data).map(([id,v])=>({id,...v})).filter(x=>x.status!=="rejected").sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
 renderChips();render();
},err=>{gallery.innerHTML='<div class="empty"><h2>Gallery Unavailable</h2><p>Please check Firebase Database rules/configuration.</p></div>';console.error(err)});
search.addEventListener("input",render);
onAuthStateChanged(auth,()=>{});
</script>
</body>
</html>
