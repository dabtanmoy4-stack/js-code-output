<style>
/* Existing UI Styles retained for safety */
:root{
  --bg:#f7f9fc;--surface:#fff;--surface2:#f1f4f8;--ink:#111827;--muted:#667085;
  --line:#dfe4ea;--brand:#1456b8;--brand2:#2f7be5;--accent:#0b2e59;--shadow:0 20px 60px rgba(15,35,65,.10);
}
html.dark{
  --bg:#07101d;--surface:#0c1624;--surface2:#111d2d;--ink:#f8fafc;--muted:#94a3b8;
  --line:#223149;--brand:#4f8fe8;--brand2:#6ea8ff;--accent:#b9d6ff;--shadow:0 20px 60px rgba(0,0,0,.35);
}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:var(--ink);background:var(--bg);}
button,input{font:inherit}button{cursor:pointer}a{text-decoration:none;color:inherit}
body{overflow-x:hidden}.hidden{display:none!important}
::-webkit-scrollbar { width:6px; height:6px; }
::-webkit-scrollbar-thumb { background:rgba(100,116,139,0.3); border-radius:3px; }

/* Landing, Header, and general app styles */
.site-nav { position:fixed;top:0;left:0;right:0;height:76px;z-index:80;display:flex;align-items:center;justify-content:space-between;padding:0 5vw;background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:blur(18px);border-bottom:1px solid var(--line); }
.landing{position:relative;min-height:100vh;padding-top:76px;overflow:hidden}.hero{min-height:760px;display:grid;grid-template-columns:1fr 1fr;gap:70px;align-items:center;padding:90px 5vw}
.primary-btn{background:var(--ink);color:var(--surface);padding:14px 20px;border-radius:12px;font-weight:bold}

#app { height:100vh;display:flex;flex-direction:column; }
#topHeader { height:58px;background:var(--surface);border-bottom:1px solid var(--line);padding:0 16px;display:flex;align-items:center;justify-content:space-between; }
#workspace { flex:1;display:flex;overflow:hidden; }
.explorer { width:220px;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column; }
.explorer-head { height:40px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-size:10px;font-weight:900; }
.explorer-body { padding:12px 0;overflow:auto;flex:1; }

/* Drag and drop zone */
.explorer-body.dragover { background: rgba(59,130,246,0.1); border: 2px dashed #3b82f6; }

.explorer-file { display:flex;align-items:center;justify-content:space-between;padding:6px 12px;font-size:12px;cursor:pointer; border-left: 2px solid transparent; }
.explorer-file:hover { background:var(--surface2); }
.explorer-file.active { background:rgba(20,86,184,.11);color:var(--brand); border-left: 2px solid var(--brand); font-weight: bold; }
.explorer-actions { padding:10px;border-top:1px solid var(--line);display:grid;gap:7px; }
.explorer-actions button, .tool-btn { border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:6px;font-size:11px; }

.main-area { flex:1;display:flex;overflow:hidden; }
.editor-panel { flex:1;display:flex;flex-direction:column;border-right:1px solid var(--line); transition: 0.2s all; }

/* FULLSCREEN EDITOR STYLE */
.editor-panel.fullscreen-editor { position: fixed; inset: 0; z-index: 9999; background: var(--bg); border: none; }

.preview-panel { flex:1;display:flex;flex-direction:column; }
.editor-tabs, .preview-toolbar { height:40px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 8px; }
.tabs { display:flex;gap:3px;overflow:auto; }
.editor-tab { height:34px;padding:0 12px;font-size:11px;border-radius:7px 7px 0 0; }
.editor-tab.active-file-tab { background:var(--surface2);color:var(--brand);border-top:2px solid var(--brand); font-weight:bold; }
.editor-content { flex:1;position:relative; }
.code-pane { position:absolute;inset:0; }
.CodeMirror { height:100%!important;font-family:"Fira Code",monospace;font-size:13px;background:#1e1e2e!important;color:#cdd6f4!important; }
.CodeMirror-matchingtag { background: rgba(255,255,255,.2); } 

#iframeContainer { flex:1;background:#0d1527;position:relative; }
#outputIframe { width:100%;height:100%;border:0;background:white; }
.app-btn { border:1px solid var(--line);padding:6px 12px;border-radius:8px;font-size:11px;font-weight:bold; }
.app-btn.run { background:#0f766e;color:white; }
</style>
</head>
<body>

<!-- Landing Page -->
<div id="landingPage" class="landing">
  <nav class="site-nav">
    <a href="#" class="font-bold text-xl"><i class="fa-solid fa-code text-blue-500"></i> JS CODE OUTPUT</a>
    <button class="primary-btn" onclick="startWithoutLogin()">Start Building</button>
  </nav>
  <section class="hero text-center">
    <div>
      <h1 class="text-5xl font-black mb-4">World-class code editor.</h1>
      <p class="text-gray-400 mb-8">Folders, clean slate, full-screen editing, and instant live output.</p>
      <button class="primary-btn" onclick="startWithoutLogin()">🚀 Enter Workspace</button>
    </div>
  </section>
</div>

<!-- Main App -->
<div id="app" class="hidden">
  <header id="topHeader">
    <div class="flex items-center gap-4">
      <div class="font-bold cursor-pointer" onclick="backToHome()"><i class="fa-solid fa-code text-blue-500"></i> WORKSPACE</div>
      <div class="text-xs px-3 py-1 bg-gray-800 rounded text-white" id="currentProjectName">My Project</div>
    </div>
    <div class="flex gap-2">
      <button class="app-btn run" onclick="updatePreview(true)"><i class="fa-solid fa-play"></i> Run</button>
      <button class="app-btn" onclick="toggleTheme()"><i class="fa-solid fa-moon"></i></button>
    </div>
  </header>

  <main id="workspace">
    <aside class="explorer">
      <div class="explorer-head">
        <span>EXPLORER</span>
        <div class="flex gap-1">
          <button onclick="createNewFile()" class="tool-btn" title="New File"><i class="fa-solid fa-file-circle-plus"></i></button>
          <button onclick="createNewFolder()" class="tool-btn" title="New Folder"><i class="fa-solid fa-folder-plus"></i></button>
          <button onclick="document.getElementById('fileUpload').click()" class="tool-btn" title="Upload Files"><i class="fa-solid fa-upload"></i></button>
          <button onclick="document.getElementById('folderUpload').click()" class="tool-btn" title="Upload Folder"><i class="fa-solid fa-folder-open"></i></button>
        </div>
      </div>
      
      <!-- Drag and Drop Area -->
      <div class="explorer-body" id="fileExplorer" 
           ondragover="event.preventDefault(); this.classList.add('dragover');" 
           ondragleave="this.classList.remove('dragover');" 
           ondrop="handleFileDrop(event)">
      </div>
      
      <div class="explorer-actions text-center text-xs text-gray-500 pb-2">
        <p>Drop files/folders here</p>
      </div>
    </aside>

    <!-- Hidden Inputs for Upload -->
    <input type="file" id="fileUpload" multiple hidden onchange="handleFileUpload(event)">
    <input type="file" id="folderUpload" webkitdirectory directory multiple hidden onchange="handleFileUpload(event)">

    <div class="main-area">
      <!-- Editor Panel -->
      <section class="editor-panel" id="editorPanel">
        <div class="editor-tabs">
          <div id="tabs" class="tabs"></div>
          <div class="flex gap-1">
            <button onclick="triggerSearch()" class="tool-btn" title="Search"><i class="fa-solid fa-magnifying-glass"></i></button>
            <button onclick="toggleEditorFullscreen()" class="tool-btn" title="Full Screen Editor"><i class="fa-solid fa-expand"></i></button>
          </div>
        </div>
        <div class="editor-content">
          <div id="wrapper-editor" class="code-pane"></div>
        </div>
      </section>

      <!-- Preview Panel -->
      <section class="preview-panel">
        <div class="preview-toolbar">
          <span class="text-xs font-bold text-gray-400">LIVE OUTPUT</span>
        </div>
        <div id="iframeContainer">
          <iframe id="outputIframe" sandbox="allow-scripts allow-modals allow-same-origin allow-forms"></iframe>
        </div>
      </section>
    </div>
  </main>
</div>

<script>
"use strict";

let files = {};
let activeFile = null;
let editor = null;

// File Icons mapped correctly
function icon(n){
  const e = n.includes(".") ? n.split(".").pop().toLowerCase() : "";
  if(e==="html" || e==="htm") return '<i class="fa-brands fa-html5 text-orange-500"></i>';
  if(e==="css") return '<i class="fa-brands fa-css3-alt text-sky-400"></i>';
  if(e==="js" || e==="mjs") return '<i class="fa-brands fa-js text-yellow-400"></i>';
  if(e==="json") return '<i class="fa-solid fa-brackets-curly text-green-400"></i>';
  if(e==="png" || e==="jpg" || e==="jpeg" || e==="svg" || e==="gif") return '<i class="fa-solid fa-image text-purple-400"></i>';
  if(e==="md") return '<i class="fa-brands fa-markdown text-blue-300"></i>';
  return '<i class="fa-solid fa-file text-gray-400"></i>';
}

function getMode(n){
  if(!n) return "text/plain";
  const e = n.split(".").pop().toLowerCase();
  return (e==="html"||e==="htm") ? "htmlmixed" : e==="css" ? "css" : (e==="js"||e==="json") ? "javascript" : "text/plain";
}

function syncEditor(){
  if(editor && activeFile && !activeFile.endsWith('/')) {
    files[activeFile] = editor.getValue();
  }
}

function startWithoutLogin(){
  document.getElementById("landingPage").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  files = {}; 
  
  if(Object.keys(files).length === 0) {
    files["index.html"] = "";
    activeFile = "index.html";
  } else {
    activeFile = Object.keys(files)[0];
  }
  
  initEditor();
  renderFileExplorer();
  openFile(activeFile);
}

function backToHome() {
  document.getElementById("app").classList.add("hidden");
  document.getElementById("landingPage").classList.remove("hidden");
}

// Tree view renderer for Folder & Files (VS Code Style)
function renderFileExplorer(){
  const el = document.getElementById("fileExplorer");
  el.innerHTML = "";

  // 1. Build a Tree Object from Flat paths
  const tree = {};
  Object.keys(files).forEach(path => {
    const parts = path.split('/');
    let current = tree;
    for (let i = 0; i < parts.length; i++) {
      const part = parts[i];
      if (part === "") continue; // Skip trailing slash artifacts
      
      const isFolder = (i < parts.length - 1) || path.endsWith('/');
      if (!current[part]) {
        current[part] = isFolder ? {} : null; // {} means folder, null means file
      }
      current = current[part];
    }
  });

  // 2. Render Tree Recursively
  function buildDOM(node, prefix = "", level = 0) {
    Object.keys(node).sort().forEach(name => {
      const isDir = node[name] !== null;
      const fullPath = prefix + name + (isDir ? "/" : "");
      
      const d = document.createElement("div");
      d.className = "explorer-file " + (fullPath === activeFile && !isDir ? "active" : "");
      d.style.paddingLeft = (12 + level * 16) + "px"; // Indentation for folders
      
      if (isDir) {
        d.innerHTML = `
          <span class="flex items-center gap-2 overflow-hidden text-ellipsis whitespace-nowrap" title="${fullPath}">
            <i class="fa-solid fa-folder text-blue-400"></i> <span>${name}</span>
          </span>
          <button onclick="deleteFile('${encodeURIComponent(fullPath)}');event.stopPropagation()" class="text-gray-400 hover:text-red-500"><i class="fa-solid fa-trash"></i></button>
        `;
        // No onclick for folder expand/collapse in this simple version, they stay expanded.
      } else {
        d.innerHTML = `
          <span class="flex items-center gap-2 overflow-hidden text-ellipsis whitespace-nowrap" title="${fullPath}">
            ${icon(name)} <span>${name}</span>
          </span>
          <button onclick="deleteFile('${encodeURIComponent(fullPath)}');event.stopPropagation()" class="text-gray-400 hover:text-red-500"><i class="fa-solid fa-trash"></i></button>
        `;
        d.onclick = () => openFile(fullPath);
      }
      
      el.appendChild(d);
      
      if (isDir) {
        buildDOM(node[name], fullPath, level + 1); // Recursively add children
      }
    });
  }
  
  buildDOM(tree);
  renderEditorTabs();
}

function renderEditorTabs(){
  const el = document.getElementById("tabs");
  el.innerHTML = "";
  if(activeFile && files[activeFile] !== undefined && !activeFile.endsWith('/')) {
      const b = document.createElement("button");
      const name = activeFile.split('/').pop();
      b.className = "editor-tab active-file-tab";
      b.innerHTML = `${icon(name)} <span>${name}</span>`;
      el.appendChild(b);
  }
}

function openFile(path){
  if(files[path] === undefined || path.endsWith('/')) return; // Do not open folders in editor
  syncEditor();
  activeFile = path;
  if(editor){
    editor.setOption("mode", getMode(path));
    editor.setValue(files[path] || "");
    setTimeout(() => editor.refresh(), 10);
  }
  renderFileExplorer();
}

function createNewFile(){
  const n = prompt("Enter file name (e.g. script.js or folder/style.css):");
  if(!n) return;
  const path = n.trim();
  if(!path || files[path] !== undefined || path.endsWith('/')) return alert("Invalid or existing file name.");
  files[path] = "";
  renderFileExplorer();
  openFile(path);
}

// CREATE FOLDER FUNCTION
function createNewFolder(){
  const n = prompt("Enter folder name:");
  if(!n) return;
  const name = n.trim();
  if(!name) return;
  const path = name.endsWith('/') ? name : name + '/';
  if(files[path] !== undefined) return alert("Folder already exists.");
  files[path] = ""; // Empty string placeholder for folder
  renderFileExplorer();
}

function deleteFile(encoded){
  const path = decodeURIComponent(encoded);
  if(!confirm(`Delete ${path}?`)) return;
  
  if(path.endsWith('/')) {
    // Delete all files inside this folder
    Object.keys(files).forEach(k => {
      if(k.startsWith(path)) delete files[k];
    });
  } else {
    delete files[path];
  }
  
  // Reset active file if it was deleted
  if(activeFile && activeFile.startsWith(path)) {
    const keys = Object.keys(files).filter(k => !k.endsWith('/'));
    activeFile = keys.length > 0 ? keys[0] : null;
    if(activeFile) {
      openFile(activeFile);
    } else {
      if(editor) editor.setValue("");
      renderEditorTabs();
    }
  }
  renderFileExplorer();
}

function toggleEditorFullscreen() {
    const panel = document.getElementById("editorPanel");
    panel.classList.toggle("fullscreen-editor");
    if(editor) setTimeout(() => editor.refresh(), 100);
}

function triggerSearch() {
  if (editor) editor.execCommand("find");
}
function toggleTheme(){ 
  document.documentElement.classList.toggle("dark"); 
}

function processFilesList(fileList) {
  Array.from(fileList).forEach(f => {
    const path = f.webkitRelativePath || f.name;
    const r = new FileReader();
    r.onload = ev => {
      files[path] = ev.target.result || "";
      if(!activeFile && !path.endsWith('/')) activeFile = path;
      renderFileExplorer();
      if(activeFile === path) openFile(path);
    };
    
    if(f.type.startsWith("image/")) {
       r.readAsDataURL(f);
    } else {
       r.readAsText(f);
    }
  });
}

function handleFileUpload(e){
  processFilesList(e.target.files || []);
  e.target.value = "";
}

function handleFileDrop(e) {
  e.preventDefault();
  document.getElementById("fileExplorer").classList.remove('dragover');
  
  if (e.dataTransfer.items) {
    const items = Array.from(e.dataTransfer.items).filter(item => item.kind === 'file');
    const droppedFiles = items.map(item => item.getAsFile());
    processFilesList(droppedFiles);
  } else {
    processFilesList(e.dataTransfer.files);
  }
}

// Smarter preview to find the right HTML, CSS, JS no matter what folder they are in
function updatePreview(){
  const htmlFile = Object.keys(files).find(k => k.endsWith('.html'));
  const html = htmlFile ? files[htmlFile] : "";
  
  const cssFile = Object.keys(files).find(k => k.endsWith('.css'));
  const css = cssFile ? files[cssFile] : "";
  
  const jsFile = Object.keys(files).find(k => k.endsWith('.js') && !k.endsWith('.json'));
  const js = jsFile ? files[jsFile] : "";

  document.getElementById("outputIframe").srcdoc = `
    <!DOCTYPE html>
    <html>
    <head>
      <style>${css}</style>
    </head>
    <body>
      ${html}
      <script>${js}<\/script>
    </body>
    </html>
  `;
}

function initEditor() {
  if(editor) return;
  const wrapper = document.getElementById("wrapper-editor");
  editor = CodeMirror(wrapper, {
    value: activeFile && files[activeFile] ? files[activeFile] : "",
    mode: getMode(activeFile),
    theme: "dracula",
    lineNumbers: true,
    autoCloseTags: true,
    matchTags: { bothTags: true }, // ENABLES HIGHLIGHTING MATCHING TAGS
    autoCloseBrackets: true,
    lineWrapping: true,
    indentUnit: 2,
    tabSize: 2
  });

  editor.on("change", () => {
    syncEditor();
    setTimeout(updatePreview, 500);
  });
}

document.documentElement.classList.add("dark");
</script>
</body>
</html>
