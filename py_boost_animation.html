<!DOCTYPE html>
<html lang="en">
<head><script src="https://cdn.tailwindcss.com"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Python Runner Boost</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Cormorant+Garamond:ital,wght@1,600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--ink:#06080c;--gold:#d8bb7a;--ivory:#f3ecdb;--F:74vh;--fs:min(12.5vw,10.5vh,116px);
--serif:'Cormorant Garamond',Georgia,serif;
--disp:'Cinzel','Cormorant Garamond','Didot',Georgia,serif;
--gd:linear-gradient(100deg,#7e5f26 0%,#cfae68 16%,#fff3d2 24%,#c9a45c 36%,#8a6a2c 50%,#e2c98e 66%,#fff3d2 74%,#b8914a 88%,#d8bb7a 100%);
--iv:linear-gradient(100deg,#9a9482 0%,#e9e2cf 16%,#fffdf5 24%,#cfc7b2 36%,#8f8a79 50%,#e9e2cf 66%,#fffdf5 74%,#b3ac98 88%,#e9e2cf 100%);
--fire:linear-gradient(0deg,#6a0703 0%,#c40f06 30%,#ff2a0e 55%,#ff6a1a 78%,#ffb347 100%)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--ink);color:var(--ivory);-webkit-font-smoothing:antialiased}
.bg{position:fixed;inset:0;background:radial-gradient(60% 55% at 50% 0,rgba(216,187,122,.14),transparent 70%),radial-gradient(90% 60% at 50% 100%,rgba(20,34,60,.5),transparent 70%)}
.floorh{position:fixed;left:0;right:0;top:var(--F);bottom:0;perspective:520px;overflow:hidden;border-top:1px solid rgba(216,187,122,.25);background:linear-gradient(#0a0f19,#04060a)}
.grid{position:absolute;left:-60%;right:-60%;top:0;height:220%;transform-origin:50% 0;transform:rotateX(72deg);
background-image:linear-gradient(rgba(216,187,122,.14) 1px,transparent 1px),linear-gradient(90deg,rgba(216,187,122,.14) 1px,transparent 1px);background-size:70px 70px;
-webkit-mask-image:linear-gradient(#000,transparent 80%);mask-image:linear-gradient(#000,transparent 80%)}
.rfade{position:fixed;left:0;right:0;top:var(--F);bottom:0;pointer-events:none;z-index:3;background:linear-gradient(rgba(4,6,10,0) 0%,rgba(4,6,10,.85) 55%,#04060a 100%)}
.vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(110% 85% at 50% 45%,transparent 55%,rgba(0,0,0,.7));z-index:5}
.scene{position:fixed;inset:0;perspective:1300px;perspective-origin:50% 38%;pointer-events:none;z-index:2}
.cam{position:absolute;inset:0;transform-style:preserve-3d}
.stack{position:absolute;left:0;right:0;bottom:calc(100vh - var(--F));display:flex;flex-direction:column;align-items:center;gap:.07em;font-size:var(--fs);transform-style:preserve-3d}
.refl{transform-origin:50% 100%;transform:scaleY(-1);opacity:.28}
.row{display:flex;gap:.07em;transform-style:preserve-3d}
.L{position:relative;display:block;font-family:var(--disp);font-weight:900;line-height:.82;transform-style:preserve-3d;will-change:transform}
.sz{display:block;visibility:hidden}
.ly{position:absolute;left:0;top:0;white-space:nowrap}
.ly.f{color:transparent;-webkit-background-clip:text;background-clip:text;background-size:250% 100%;background-position:0 0}
.ly.f.gold{background-image:var(--gd)}
.ly.f.ivory{background-image:var(--iv)}
.ly.f.fire{background-image:var(--fire);background-size:100% 160%;background-position:0 100%}
.done .main .ly.f.fire{animation:fl 2.2s ease-in-out infinite alternate}
@keyframes fl{from{background-position:0 100%}to{background-position:0 55%}}
.coin{position:relative;width:calc(var(--fs)*1.3);height:calc(var(--fs)*1.3);margin-bottom:.05em;transform-style:preserve-3d;will-change:transform}
.crown{position:relative;width:calc(var(--fs)*1);height:calc(var(--fs)*.78);margin-bottom:calc(var(--fs)*-.22);transform-style:preserve-3d;will-change:transform}
.ct{position:absolute;inset:0;transform-style:preserve-3d;transform-origin:50% 100%;transform:rotateZ(-11deg) rotateX(-15deg) rotateY(9deg)}
.p3{position:absolute;transform-style:preserve-3d}
.o,.i{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.i{transform:rotateY(180deg)}
.gm,.pl,.ob,.ar,.vd{position:absolute}
.gm,.pl,.ob,.vd{border-radius:50%}
.gm{backface-visibility:hidden;-webkit-backface-visibility:hidden}
.glow{position:absolute;left:50%;top:48%;pointer-events:none;border-radius:50%;opacity:0;transition:opacity 1.2s;background:radial-gradient(circle,rgba(255,214,110,.5) 0%,rgba(255,176,50,.2) 36%,rgba(255,150,30,0) 70%)}
.crowned .glow{opacity:1;animation:gp 2.6s ease-in-out infinite alternate}
@keyframes gp{from{opacity:.65}to{opacity:1}}
.c{position:absolute;inset:0;border-radius:50%}
.face{display:grid;place-items:center;overflow:hidden;background:#fff;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:inset 0 0 0 3px rgba(216,187,122,.6)}
.face::after{content:"";position:absolute;inset:0;border-radius:50%;background:linear-gradient(135deg,rgba(255,255,255,0) 40%,rgba(0,0,0,.14) 100%)}
.face svg,.face img{width:94%;height:94%;object-fit:contain;border-radius:50%}
.tag{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 5vh);text-align:center;z-index:6;opacity:0;transition:none;pointer-events:none}
.done .tag,.text-active .tag{opacity:1;bottom:calc(env(safe-area-inset-bottom,0px) + 12vh)}
.start-boost{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 3vh);z-index:8;transform:translate(-50%,14px);opacity:0;visibility:hidden;pointer-events:none;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-width:220px;padding:14px 25px;border:1px solid rgba(255,243,210,.85);border-radius:999px;background:linear-gradient(135deg,#f8e6ad 0%,#c9a45c 38%,#8a6a2c 68%,#e8cf8e 100%);color:#100d07;font-family:var(--disp);font-size:14px;font-weight:900;letter-spacing:.13em;text-decoration:none;box-shadow:0 0 18px rgba(216,187,122,.2),inset 0 1px 0 rgba(255,255,255,.75);transition:opacity 0s,transform 0s,box-shadow .35s ease;pointer-events:none}
.start-boost::after{content:"↗";font-size:18px;transition:transform .3s ease}
.start-boost:hover{box-shadow:0 0 30px rgba(216,187,122,.45),0 8px 26px rgba(0,0,0,.4);transform:translate(-50%,0) scale(1.035)}
.start-boost:hover::after{transform:translate(3px,-2px)}
.start-boost.visible{opacity:1;visibility:visible;pointer-events:auto;transform:translate(-50%,0)}
@media(max-width:480px){.start-boost{min-width:205px;padding:13px 20px;font-size:12px}.done .tag,.text-active .tag{bottom:calc(env(safe-area-inset-bottom,0px) + 13vh)}}
.tag span{display:block;font-family:var(--serif);font-style:italic;font-weight:600;font-size:clamp(17px,4.6vw,22px);letter-spacing:.08em;color:var(--gold)}
.tag b{display:inline-block;margin-top:8px;font-family:var(--disp);font-weight:700;font-size:17px;letter-spacing:.14em;min-width:14ch;min-height:1.3em}
.tag b::after{content:"";display:inline-block;width:1px;height:16px;margin-left:3px;vertical-align:-2px;background:var(--gold);animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:4}
</style>
</head>
<body>
<div class="bg"></div>
<div class="floorh"><div class="grid"></div></div>
<div class="scene"><div class="cam" id="cam">
  <div class="stack main" id="main"></div>
  <div class="stack refl" id="refl"></div>
</div></div>
<div class="rfade"></div>
<canvas id="fx"></canvas>
<div class="vig"></div>
<div class="tag"><span>Powered by JS Code Output</span><b id="val"></b></div>
<a class="start-boost" id="startBoost" href="#">START BOOSTING</a>

<div class="modal-backdrop" id="securityModal" aria-hidden="true">
  <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-orb"><i class="fa-solid fa-shield-halved" id="modalIcon"></i></div>
    <div class="modal-eyebrow" id="modalEyebrow">SAFETY CHECK</div>
    <h2 id="modalTitle">Sign in to continue</h2>
    <p id="modalMessage">For your safety, please sign in with Google before continuing to the Python Runner.</p>
    <div class="modal-error" id="modalError" role="alert"></div>
    <button class="modal-primary" id="googleSignIn"><i class="fa-brands fa-google"></i><span>Continue with Google</span></button>
    <button class="modal-secondary" id="modalClose" type="button">Cancel</button>
  </section>
</div>

<style>
.modal-backdrop{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:22px;background:rgba(2,4,8,.76);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .28s ease,visibility .28s ease}
.modal-backdrop.open{opacity:1;visibility:visible;pointer-events:auto}
.modal-card{position:relative;width:min(100%,420px);padding:32px 27px 25px;text-align:center;overflow:hidden;border:1px solid rgba(216,187,122,.45);border-radius:26px;background:radial-gradient(120% 80% at 50% 0,rgba(216,187,122,.13),transparent 65%),linear-gradient(145deg,#111722,#07090e 75%);box-shadow:0 25px 90px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.06);transform:translateY(16px) scale(.97);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.modal-backdrop.open .modal-card{transform:translateY(0) scale(1)}
.modal-card:before{content:"";position:absolute;top:0;left:12%;right:12%;height:1px;background:linear-gradient(90deg,transparent,#f5dfaa,transparent);box-shadow:0 0 18px rgba(216,187,122,.55)}
.modal-orb{width:62px;height:62px;margin:0 auto 17px;display:grid;place-items:center;border:1px solid rgba(216,187,122,.42);border-radius:50%;color:#f2d99c;font-size:25px;background:radial-gradient(circle,rgba(216,187,122,.18),rgba(216,187,122,.025));box-shadow:0 0 32px rgba(216,187,122,.12);animation:orbPulse 2.6s ease-in-out infinite}
@keyframes orbPulse{50%{box-shadow:0 0 42px rgba(216,187,122,.24);transform:translateY(-2px)}}
.modal-eyebrow{font:700 10px/1.4 Arial,sans-serif;letter-spacing:.24em;color:#d8bb7a;margin-bottom:9px}
.modal-card h2{font-family:var(--disp);font-size:clamp(20px,5vw,26px);line-height:1.25;color:#fff5dc;margin:0 0 12px}
.modal-card p{max-width:330px;margin:0 auto 22px;color:#b8b7b0;font:14px/1.7 Arial,sans-serif}
.modal-primary,.modal-secondary{width:100%;min-height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:11px;font:700 13px Arial,sans-serif;letter-spacing:.02em;cursor:pointer;transition:transform .2s ease,box-shadow .2s ease,background .2s ease}
.modal-primary{border:1px solid #f3dfac;color:#171107;background:linear-gradient(120deg,#fff0c6,#d8bb7a 48%,#a98542);box-shadow:0 7px 22px rgba(216,187,122,.16)}
.modal-primary:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(216,187,122,.28)}
.modal-primary:disabled{opacity:.65;cursor:wait;transform:none}
.modal-secondary{margin-top:10px;border:1px solid rgba(255,255,255,.1);color:#a9a9a5;background:rgba(255,255,255,.035)}
.modal-secondary:hover{background:rgba(255,255,255,.075);color:#fff}
.modal-error{display:none;margin:-8px 0 15px;color:#ffaaa0;font:12px/1.5 Arial,sans-serif}.modal-error.show{display:block}
@media(max-width:420px){.modal-card{padding:28px 21px 21px;border-radius:22px}.modal-card p{font-size:13px}}
</style>

const cam = $("cam"), mainEl = $("main"), reflEl = $("refl"), cv = $("fx"), g = cv.getContext("2d");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const D = Math.min(devicePixelRatio || 1, 2);
let W, H, FS = 100;
function size() { W = innerWidth; H = innerHeight; cv.width = W * D; cv.height = H * D; g.setTransform(D, 0, 0, D, 0, 0); }
size();

const rnd = (a, b) => a + Math.random() * (b - a);
function mix(a, b, t) {
  const p = h => [1, 3, 5].map(i => parseInt(h.substr(i, 2), 16));
  const A = p(a), B = p(b);
  return "rgb(" + A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(",") + ")";
}

/* ---------- 3D letters (stacked layers = thickness) ---------- */
const PAL = { gold: ["#e8cf8e", "#33230a"], ivory: ["#d8d1bd", "#38352b"], fire: ["#e0200f", "#2e0402"] };
function mkLetter(ch, theme, layers, step) {
  const L = document.createElement("div"); L.className = "L";
  const sz = document.createElement("span"); sz.className = "sz"; sz.textContent = ch; L.appendChild(sz);
  const pal = PAL[theme], half = (layers - 1) * step / 2;
  for (let i = layers - 1; i >= 0; i--) {
    const s = document.createElement("span"); s.className = "ly"; s.textContent = ch;
    if (i === 0) s.classList.add("f", theme);
    else s.style.color = mix(pal[0], pal[1], i / (layers - 1));
    s.style.transform = `translateZ(${(half - i * step).toFixed(2)}px)`;
    L.appendChild(s);
  }
  return L;
}

/* ---------- 3D coin with your logo ---------- */
const FALLBACK_LOGO = `<svg viewBox="0 0 100 100" aria-hidden="true">
<circle cx="50" cy="50" r="46" fill="#fff" stroke="#1f2a3a" stroke-width="3"/>
<text x="50" y="43" text-anchor="middle" font-family="Consolas,Menlo,monospace" font-weight="700" font-size="19" fill="#1f2a3a">&lt;JS/&gt;</text>
<text x="50" y="64" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="19" fill="#1f2a3a" letter-spacing="1">CODE</text>
<line x1="24" y1="71" x2="38" y2="71" stroke="#1f2a3a" stroke-width="1.2"/><line x1="62" y1="71" x2="76" y2="71" stroke="#1f2a3a" stroke-width="1.2"/>
<text x="50" y="74" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="7" fill="#1f2a3a" letter-spacing="2">OUTPUT</text>
</svg>`;
function mkFace(tr) {
  const f = document.createElement("div"); f.className = "c face"; f.innerHTML = FALLBACK_LOGO; f.style.transform = tr;
  if (LOGO_URL) {
    const im = new Image();
    im.onload = () => { f.querySelector("svg, img") && f.replaceChildren(im); };
    im.src = LOGO_URL;
  }

const auth = firebase.auth();
const securityModal = $("securityModal");
const modalTitle = $("modalTitle"), modalMessage = $("modalMessage");
const modalEyebrow = $("modalEyebrow"), modalIcon = $("modalIcon");
const googleSignIn = $("googleSignIn"), modalClose = $("modalClose"), modalError = $("modalError");
let maintenanceView = false;
function openModal(){ securityModal.classList.add("open"); securityModal.setAttribute("aria-hidden","false"); }
function closeModal(){ securityModal.classList.remove("open"); securityModal.setAttribute("aria-hidden","true"); }
function showSafetyPrompt(){
  maintenanceView = false;
  modalEyebrow.textContent = "SAFETY CHECK";
  modalIcon.className = "fa-solid fa-shield-halved";
  modalTitle.textContent = "Sign in to continue";
  modalMessage.textContent = "For your safety, please sign in with Google before continuing to the Python Runner.";
  googleSignIn.style.display = "flex"; googleSignIn.disabled = false;
  googleSignIn.innerHTML = '<i class="fa-brands fa-google"></i><span>Continue with Google</span>';
  modalClose.style.display = "flex"; modalClose.textContent = "Cancel";
  modalError.classList.remove("show"); modalError.textContent = "";
  openModal();
}
function showMaintenanceNotice(){
  maintenanceView = true;
  modalEyebrow.textContent = "TEMPORARILY UNAVAILABLE";
  modalIcon.className = "fa-solid fa-screwdriver-wrench";
  modalTitle.textContent = "Boost Is Temporarily Unavailable";
  modalMessage.textContent = "Due to a payment-related issue, our Boost service is temporarily unavailable. Our team is working on a recovery, and we expect to restore the service as soon as possible. Thank you for your patience.";
  googleSignIn.style.display = "none";
  modalClose.style.display = "flex"; modalClose.textContent = "Got it";
  modalError.classList.remove("show"); modalError.textContent = "";
  openModal();
}
$("startBoost").addEventListener("click", async event => {
  event.preventDefault();
  try {
    if (auth.currentUser) showMaintenanceNotice();
    else showSafetyPrompt();
  } catch (_) { showSafetyPrompt(); }
});
googleSignIn.addEventListener("click", async () => {
  modalError.classList.remove("show");
  googleSignIn.disabled = true;
  googleSignIn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i><span>Signing in...</span>';
  try {
    const provider = new firebase.auth.GoogleAuthProvider();
    provider.setCustomParameters({ prompt: "select_account" });
    await auth.signInWithPopup(provider);
    showMaintenanceNotice();
  } catch (error) {
    modalError.textContent = error && error.code === "auth/popup-closed-by-user"
      ? "Sign-in was cancelled. Please sign in with Google to continue."
      : "Google sign-in could not be completed. Please try again.";
    modalError.classList.add("show");
    googleSignIn.disabled = false;
    googleSignIn.innerHTML = '<i class="fa-brands fa-google"></i><span>Continue with Google</span>';
  }
});
modalClose.addEventListener("click", () => {
  if (maintenanceView) window.location.href = "js_python_runner.html";
  else closeModal();
});
securityModal.addEventListener("click", event => { if (event.target === securityModal && !maintenanceView) closeModal(); });
